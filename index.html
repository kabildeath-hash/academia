        function makeUsername(name, used) { 
            if (!name || typeof name !== 'string') name = 'Player';
            const parts = name.trim().toLowerCase().split(/\s+/); 
            const first = parts[0] || 'p';
            const last = parts[parts.length - 1] || first;
            const base = (first[0] + last).replace(/[^a-z]/g,''); 
            let u = base || 'player', i = 2; 
            while (used.has(u)) { 
                u = base + i; 
                i++; 
            } 
            used.add(u); 
            return u; 
        }

// FILE HANDLE PERSISTENCE (File System Access API)
// ============================================================
const IDB_NAME = 'academia_rise_handles';
const IDB_STORE = 'handles';
const SAVE_FILE_HANDLE_KEY = 'save_file';

function openIDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function idbGet(key) {
    try { const db = await openIDB(); return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }); } catch { return null; }
}
async function idbSet(key, val) {
    try { const db = await openIDB(); return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
    }); } catch { return false; }
}
async function idbDel(key) {
    try { const db = await openIDB(); return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
    }); } catch { return false; }
}

        function getProfile(id, catalog, state) {
            const base = catalog.find(p => p.id === id) || { name: 'Unknown', username: 'unknown', nationality: 'American', age: 20, status: 'University', specialization: 'General', vip: false, avatar: '🦊', motto: '', bio: '', favSubject: 'General' };
            const override = state?.profiles?.[id] || {};
            if (id === 'human') {
                return { ...base, ...override, name: state.human.name, avatar: state.human.customization?.avatar || base.avatar, motto: state.human.customization?.motto || base.motto, bio: state.human.customization?.bio || base.bio };
            }
            return { ...base, ...override };
        }

        // ============================================================ // ELO RANKED RP ENGINE & CALCULATIONS // ============================================================ 
        function computeTitleIdx(xp) { let idx = 0; for (let i = 0; i < TITLE_XP.length; i++) if (xp >= TITLE_XP[i]) idx = i; return idx; } 
        function computeTierForRank(rank) { if (rank <= 125) return 'HT1'; if (rank <= 250) return 'LT1'; if (rank <= 375) return 'HT2'; if (rank <= 500) return 'LT2'; if (rank <= 625) return 'HT3'; if (rank <= 750) return 'LT3'; if (rank <= 875) return 'HT4'; return 'LT4'; } 
        function comboMultiplier(combo) { if (combo <= 0) return 1; if (combo <= 10) return 1 + combo * 0.05; if (combo <= 25) return 1.5 + (combo - 10) * 0.08; if (combo <= 50) return 2.7 + (combo - 25) * 0.12; if (combo <= 100) return 5.7 + (combo - 50) * 0.22; return 16.7 * Math.pow(1.02, combo - 100); } 
        function rollPetFromEgg(egg, rng) { const roll = rng(); let cum = 0, chosenRarity = 'Common'; for (const [r, w] of RARITY_WEIGHTS) { cum += w; if (roll <= cum) { chosenRarity = r; break; } } const candidates = egg.pets.filter(p => p.rar === chosenRarity); return pick(rng, candidates.length ? candidates : egg.pets); } 
        function petBonus(human) { if (!human.equippedPet) return { ab:null, val:0, def:null }; const pet = human.inventory.pets.find(p => p.instanceId === human.equippedPet); if (!pet) return { ab:null, val:0, def:null }; const def = EGGS.flatMap(e => e.pets).find(p => p.name === pet.petName); if (!def) return { ab:null, val:0, def:null }; const levelMul = 1 + 0.05 * (pet.level - 1); return { ab: def.ab, val: def.val * levelMul, def }; } 
        function potionBonus(human) { if (!human.activePotion) return { mult:1, comboDiscount:false }; const p = human.activePotion; if (Date.now() > p.expires) return { mult:1, comboDiscount:false }; if (p.type === 'double_xp') return { mult:2, comboDiscount:false }; if (p.type === 'golden_study') return { mult:1.5, comboDiscount:false }; if (p.type === 'combo_craze') return { mult:1, comboDiscount:true }; return { mult:1, comboDiscount:false }; } 
        function calcTaskXp(baseXp, human, taskType) { const comboMult = comboMultiplier(human.combo); const pb = petBonus(human); let petBonusVal = 0; if (pb.def) { if (pb.def.ab === 'xp_all') petBonusVal = pb.val; else if (pb.def.ab === 'xp_assign' && taskType === 'assignment') petBonusVal = pb.val; else if (pb.def.ab === 'xp_study' && taskType === 'study') petBonusVal = pb.val; else if (pb.def.ab === 'xp_recall' && taskType === 'study') petBonusVal = pb.val; else if (pb.def.ab === 'xp_mock' && taskType === 'mock') petBonusVal = pb.val; } const pBonus = potionBonus(human); return Math.max(1, Math.floor(baseXp * comboMult * (1 + petBonusVal) * pBonus.mult)); } 

        function calcEloTransfer(winnerRp, loserRp, repeatCount = 0) {
            const K = 40;
            const P = 1 / (1 + Math.pow(10, (loserRp - winnerRp) / 400));
            const farmPenalty = 1 / (1 + repeatCount * 0.5); // Progressively reduces rewards for repeated farming
            const transfer = Math.round(K * (1 - P) * farmPenalty);
            return Math.max(1, transfer);
        }

        function findClosestOpponent(humanRp, state, catalog, category) {
            // Matchmake within a single category ladder. `category` is a RANKED_CATEGORIES id.
            const candidates = catalog.filter(p => p.id !== 'human' && !state.ai[p.id]?.retired);
            candidates.sort((a, b) => {
                const ra = category ? getCatRp(state, a.id, category) : (state.ai[a.id]?.rp || 1000);
                const rb = category ? getCatRp(state, b.id, category) : (state.ai[b.id]?.rp || 1000);
                return Math.abs(ra - humanRp) - Math.abs(rb - humanRp);
            });
            const topPool = candidates.slice(0, 12);
            return pick(Math.random, topPool);
        }

        function resolveRankedMatch(state, catalog) {
            const h = state.human;
            const m = h.activeMatch;
            if (!m) return null;

            const oppId = m.opponentId;
            const oppState = state.ai[oppId];
            const cat = m.category || h.rankedCategory || 'assignments';
            const oppRp = oppState ? getCatRp(state, oppId, cat) : RANKED_CAT_BY_ID[cat].startRp;
            const humanRp = getCatRp(state, 'human', cat);

            const myXp = m.humanXp || 0;
            const oppXp = Math.floor(m.targetOppXp);

            let outcome = 'draw';
            let transfer = 0;
            const oppHist = (h.oppHistoryByCat && h.oppHistoryByCat[cat]) || {};

            if (myXp > oppXp) {
                outcome = 'win';
                const repeats = oppHist[oppId] || 0;
                transfer = calcEloTransfer(humanRp, oppRp, repeats);
                const actualGain = Math.min(transfer, oppRp); // Cannot drop opponent below 0
                setCatRp(state, 'human', cat, humanRp + actualGain);
                if (oppState) setCatRp(state, oppId, cat, oppRp - actualGain);
                h.rankedWins += 1;
                h.rankedWinsByCat[cat] = (h.rankedWinsByCat[cat] || 0) + 1;
                h.weeklyStats.rankedWins = (h.weeklyStats.rankedWins || 0) + 1;
                oppHist[oppId] = repeats + 1;
                h.oppHistoryByCat[cat] = oppHist;
                // Spendable currency: each win banks a few coins for the potion shop.
                h.rp = (h.rp || 0) + Math.max(5, Math.round(actualGain * 0.5));
                transfer = actualGain;
            } else if (oppXp > myXp) {
                outcome = 'loss';
                transfer = calcEloTransfer(oppRp, humanRp, 0);
                const actualLoss = Math.min(transfer, humanRp); // Cannot drop human below 0
                setCatRp(state, 'human', cat, Math.max(0, humanRp - actualLoss));
                if (oppState) setCatRp(state, oppId, cat, oppRp + actualLoss);
                h.rankedLosses += 1;
                h.rankedLossesByCat[cat] = (h.rankedLossesByCat[cat] || 0) + 1;
                // A small consolation coin for participating.
                h.rp = (h.rp || 0) + 2;
                transfer = -actualLoss;
            } else {
                outcome = 'draw';
                transfer = 0;
                h.rankedDraws += 1;
                h.rankedDrawsByCat[cat] = (h.rankedDrawsByCat[cat] || 0) + 1;
                h.rp = (h.rp || 0) + 3;
            }

            syncHumanRpCurrency(state);
            if (oppState) syncAiRpMirror(state, oppId);
            h.activeMatch = null;
            const oppProf = getProfile(oppId, catalog, state);
            const catMeta = RANKED_CAT_BY_ID[cat] || {};
            const record = {
                ts: Date.now(),
                mode: m.modeName,
                hours: m.hours,
                category: cat,
                categoryIcon: catMeta.icon || '',
                categoryName: catMeta.name || cat,
                oppId,
                oppName: oppProf.name,
                myXp,
                oppXp,
                outcome,
                rpDelta: transfer
            };

            state.recentMatches.unshift(record);
            if (state.recentMatches.length > 50) state.recentMatches.pop();

            h.careerHistory.push({
                ts: Date.now(),
                type: outcome === 'win' ? 'ranked_win' : 'ranked_match',
                note: `${catMeta.name || cat} ${m.modeName} Ranked vs ${oppProf.name} (${outcome.toUpperCase()})`,
                rp: transfer
            });

            return record;
        }

        // ============================================================ // ADVANCED AI SIMULATION & BACKGROUND ELO // ============================================================
        // Realism model: each AI has a personality archetype (peakHour, variability, competitiveness,
        // joinTendency). On every simulated hour we model:
        //   1. Circadian activity — a smooth double-peak around the archetype's peakHour, with a
        //      gentle weekend dip (people study a bit less on weekends).
        //   2. Mood drift — a slow random walk in [-1,1]. Bad mood days throttle output; good moods boost it.
        //   3. Sessions — AIs don't grind uniformly. They enter "study sessions" of a few hours during
        //      which output is high, then take rest gaps. Burst grinders get long gaps between intense
        //      sessions; consistent scholars get short, even sessions.
        //   4. Slumps & streaks — occasionally a slump depresses output for 12-48h; winning streaks build
        //      `streakHeat` that raises confidence and duel willingness.
        //   5. Per-category specialization — each AI leans on one or two categories more than others
        //      (memorizers favor Studying, assignment machines favor Assignments, etc.), so each
        //      ladder's top player is genuinely different people.
        function getActivityMultiplier(hour, weekday, peakHours) {
            // peakHours can be a single hour (number) or a list of hours. We compute a smooth
            // multi-peak profile so AIs feel like they have a real daily rhythm, not a single spike.
            const peaks = Array.isArray(peakHours) ? peakHours : [peakHours || 14];
            let best = 0.1;
            for (const ph of peaks) {
                const dist = Math.min(Math.abs(hour - ph), 24 - Math.abs(hour - ph));
                const circ = Math.max(0.1, 1 - dist / 12);
                if (circ > best) best = circ;
            }
            const weekendDip = (weekday === 0 || weekday === 6) ? 0.85 : 1.0;
            // Late-night (1-5am) is quiet for most archetypes unless they're night owls.
            const nightDip = (hour >= 1 && hour <= 5) ? 0.6 : 1.0;
            return best * weekendDip * nightDip;
        }

        // Map an archetype id to the categories it favors (weights). Affects XP split + duel picks.
        function archetypeCategoryBias(archetypeName) {
            const n = (archetypeName || '').toLowerCase();
            if (n.indexOf('memori') >= 0) return { assignments: 0.6, studying: 1.5, other: 0.7 };
            if (n.indexOf('assignment') >= 0) return { assignments: 1.6, studying: 0.7, other: 0.6 };
            if (n.indexOf('ranked') >= 0 || n.indexOf('strateg') >= 0) return { assignments: 1.0, studying: 1.0, other: 1.3 };
            if (n.indexOf('burst') >= 0) return { assignments: 1.3, studying: 1.1, other: 0.6 };
            if (n.indexOf('perfection') >= 0) return { assignments: 1.2, studying: 1.2, other: 0.8 };
            if (n.indexOf('early') >= 0) return { assignments: 1.1, studying: 0.9, other: 1.0 };
            if (n.indexOf('night') >= 0) return { assignments: 0.9, studying: 1.2, other: 1.0 };
            if (n.indexOf('prodigy') >= 0) return { assignments: 1.0, studying: 1.3, other: 0.8 };
            if (n.indexOf('casual') >= 0) return { assignments: 0.7, studying: 0.7, other: 1.2 };
            return { assignments: 1.0, studying: 1.0, other: 1.0 };
        }

        function simulateAIsStep(state, catalog, elapsedMs) {
            const now = Date.now();
            const totalHours = elapsedMs / 3600000;
            const steps = Math.min(168, Math.max(1, Math.floor(totalHours)));
            const stepHours = totalHours / steps;

            for (let s = 0; s < steps; s++) {
                const ts = now - (steps - s) * stepHours * 3600000;
                const npd = npDate(ts);                 // Nepal wall time for this step
                const hour = npd.getHours();
                const weekday = npd.getDay();
                // The AIs are students too: they sleep 8pm–4am Nepal time — no grinding,
                // no duels (the human player can study whenever they like).
                const asleep = hour >= 20 || hour < 4;
                const bucket = Math.floor(ts / 3600000);

                // --- Per-AI XP grinding (realistic cadence) ---
                for (const p of catalog) {
                    if (p.id === 'human') continue;
                    const cur = state.ai[p.id];
                    if (!cur || cur.retired) continue;
                    if (ts < cur.offUntil) continue; // still on a break
                    if (asleep) { cur.energy = clamp((cur.energy || 1) + 0.08, 0.25, 1.6); continue; } // sleeping: no grinding, energy recovers

                    const pr = p.aiProfile;
                    const rng = mulberry32(hashStr(p.id + '_' + bucket));

                    // Energy wanders but recovers toward 1.0 between sessions.
                    cur.energy = clamp(cur.energy + (rng() - 0.48) * 0.08, 0.25, 1.6);

                    // Mood drifts as a slow random walk.
                    cur.mood = clamp((cur.mood || 0) + (rng() - 0.5) * 0.15, -1, 1);

                    // Sessions: if not in one, maybe start one (likelihood depends on activity multiplier).
                    const peakHours = pr.peakHour ? [pr.peakHour] : [14];
                    const actMul = getActivityMultiplier(hour, weekday, peakHours);
                    if (ts > (cur.sessionEnd || 0)) {
                        // Chance to start a new session scales with activity and joinTendency.
                        const startChance = 0.05 + 0.20 * actMul * (pr.joinTendency || 0.6);
                        if (rng() < startChance) {
                            // Session length: consistent scholars get long steady sessions; burst/prodigy
                            // get short intense ones; casuals get short light ones.
                            const base = 1 + Math.round(actMul * 3);
                            const intensity = pr.variability > 0.7 ? 0.8 : 1.1; // burst types: short but intense
                            cur.sessionEnd = ts + (base * intensity) * 3600000;
                            cur.sessionMul = 1.0 + 0.5 * (pr.variability || 0.3);
                        } else {
                            // Rest gap: occasional longer breaks (lunch, sleep, life).
                            cur.sessionMul = 0.0;
                            if (rng() < 0.02) cur.offUntil = ts + randInt(rng, 6, 30) * 3600000;
                            continue;
                        }
                    }
                    if (!cur.sessionMul) cur.sessionMul = 1.0;

                    // Slumps: rare, depress output for a stretch.
                    if (!cur.slumpUntil || ts > cur.slumpUntil) {
                        if (rng() < 0.004) cur.slumpUntil = ts + randInt(rng, 12, 48) * 3600000;
                    }
                    const slumpMul = (cur.slumpUntil && ts < cur.slumpUntil) ? 0.4 : 1.0;

                    // Variability per step.
                    const varMul = Math.max(0.05, 1 + (rng() - 0.5) * pr.variability * 2);
                    // Mood: good mood boosts, bad mood throttles.
                    const moodMul = 1 + 0.3 * (cur.mood || 0);
                    // Winning streak heat gives a small confidence boost.
                    const heatMul = 1 + Math.min(0.4, (cur.streakHeat || 0) * 0.05);

                    const gain = pr.dailyXpAvg * (stepHours / 24) * actMul * varMul * cur.energy * (cur.sessionMul || 1) * slumpMul * moodMul * heatMul;
                    cur.xp += Math.max(0, gain);

                    // Distribute a little "category heat" so duels reflect recent focus.
                    const bias = archetypeCategoryBias(pr.archetype);
                    const catPick = mulberry32(hashStr(p.id + '_catpick_' + bucket))();
                    let acc = 0, chosen = 'assignments';
                    const total = bias.assignments + bias.studying + bias.other;
                    for (const c of RANKED_CATEGORIES) { acc += bias[c.id] / total; if (catPick <= acc) { chosen = c.id; break; } }
                    cur.catHeat = cur.catHeat || {};
                    cur.catHeat[chosen] = (cur.catHeat[chosen] || 0) + stepHours * 0.5;
                    // Heat decays slowly so old focus fades.
                    for (const c of RANKED_CATEGORIES) cur.catHeat[c.id] = Math.max(0, (cur.catHeat[c.id] || 0) - 0.02 * stepHours);
                }

                // --- Simulated AI vs AI Ranked ELO duels, per category ---
                // Each category ladder resolves its own duels with its own matchmaking, so the three
                // leaderboards evolve independently and end up with different top players.
                // No duels during the 8pm–4am Nepal sleep window.
                for (const cat of (asleep ? [] : RANKED_CATEGORIES)) {
                    const duelRng = mulberry32(bucket + 999 + hashStr(cat));
                    const activeAIs = catalog.filter(p => p.id !== 'human' && !state.ai[p.id]?.retired && ts >= (state.ai[p.id]?.lastDuelTs || 0));
                    if (activeAIs.length < 2) continue;
                    activeAIs.sort((a, b) => getCatRp(state, b.id, cat.id) - getCatRp(state, a.id, cat.id));

                    // Duel volume scales with how many scholars are active and how competitive this
                    // category is at this hour. Not a fixed 40 — it breathes with the day.
                    const duelCount = Math.min(30, Math.max(2, Math.floor(activeAIs.length / 30 * (0.5 + getActivityMultiplier(hour, weekday, cat.peakHours)))));

                    for (let d = 0; d < duelCount; d++) {
                        const idx1 = randInt(duelRng, 0, activeAIs.length - 2);
                        const idx2 = Math.min(activeAIs.length - 1, idx1 + randInt(duelRng, 1, 8));
                        const p1 = activeAIs[idx1];
                        const p2 = activeAIs[idx2];
                        const s1 = state.ai[p1.id];
                        const s2 = state.ai[p2.id];
                        if (!s1 || !s2) continue;
                        // Bias: an AI whose archetype favors this category fights harder in it.
                        const b1 = (archetypeCategoryBias(p1.aiProfile.archetype)[cat.id] || 1);
                        const b2 = (archetypeCategoryBias(p2.aiProfile.archetype)[cat.id] || 1);
                        const catHeat1 = 0.7 + Math.min(0.9, (s1.catHeat && s1.catHeat[cat.id] || 0) * 0.1);
                        const catHeat2 = 0.7 + Math.min(0.9, (s2.catHeat && s2.catHeat[cat.id] || 0) * 0.1);
                        const score1 = p1.aiProfile.dailyXpAvg * s1.energy * catHeat1 * b1 * rand(duelRng, 0.5, 1.5) * (1 + 0.2 * (s1.mood || 0));
                        const score2 = p2.aiProfile.dailyXpAvg * s2.energy * catHeat2 * b2 * rand(duelRng, 0.5, 1.5) * (1 + 0.2 * (s2.mood || 0));

                        const rp1 = getCatRp(state, p1.id, cat.id);
                        const rp2 = getCatRp(state, p2.id, cat.id);
                        if (score1 > score2) {
                            const tr = Math.min(calcEloTransfer(rp1, rp2, 0), rp2);
                            setCatRp(state, p1.id, cat.id, rp1 + tr);
                            setCatRp(state, p2.id, cat.id, Math.max(0, rp2 - tr));
                            s1.streakHeat = (s1.streakHeat || 0) + 1;
                            s2.streakHeat = Math.max(0, (s2.streakHeat || 0) - 1);
                        } else if (score2 > score1) {
                            const tr = Math.min(calcEloTransfer(rp2, rp1, 0), rp1);
                            setCatRp(state, p2.id, cat.id, rp2 + tr);
                            setCatRp(state, p1.id, cat.id, Math.max(0, rp1 - tr));
                            s2.streakHeat = (s2.streakHeat || 0) + 1;
                            s1.streakHeat = Math.max(0, (s1.streakHeat || 0) - 1);
                        }
                        // Throttle this pair so they don't rematch every hour.
                        s1.lastDuelTs = ts + randInt(duelRng, 2, 9) * 3600000;
                        s2.lastDuelTs = ts + randInt(duelRng, 2, 9) * 3600000;
                    }
                }

                // Keep AI legacy .rp mirror fresh once per simulated hour.
                if (s % 3 === 0) {
                    for (const p of catalog) if (p.id !== 'human') syncAiRpMirror(state, p.id);
                }
            }

            enforceVIPAndChurn(state, catalog);
            // Final mirror sync after a tick.
            for (const p of catalog) if (p.id !== 'human') syncAiRpMirror(state, p.id);
        }

        function enforceVIPAndChurn(state, catalog) {
            // Season reset: everyone starts at 0. We no longer auto-boost VIP XP — VIPs must earn
            // their ladder position like everyone else. We do keep a light churn rule so the very
            // bottom of the field occasionally "retires" (quits the season), which keeps the
            // leaderboards from filling with permanently-inactive zero-output scholars.
            const rng = mulberry32(Math.floor((Date.now() + NP_OFFSET_MIN * 60000) / 86400000)); // daily seed rolls over at Nepal midnight
            for (const p of catalog) {
                if (p.id === 'human' || p.vip) continue;
                const cur = state.ai[p.id];
                if (!cur) continue;
                // Only churn players who have barely moved in *any* category for a long time.
                let bestRp = 0;
                for (const c of RANKED_CATEGORIES) bestRp = Math.max(bestRp, getCatRp(state, p.id, c.id));
                if (!cur.retired && bestRp <= RANKED_CATEGORIES[0].startRp && cur.xp < 2000 && rng() < 0.00005) {
                    cur.retired = true;
                }
            }
        } 

        function runTick(state, catalog, force) { 
            const now = Date.now(); 
            const elapsed = now - (state.lastTick || now); 
            state.lastTick = now; 
            
            // Check if active Ranked Match has ended
            if (state.human.activeMatch && now >= state.human.activeMatch.end) {
                resolveRankedMatch(state, catalog);
            }

            if (elapsed > 0 || force) simulateAIsStep(state, catalog, elapsed); 
            
            const today = todayKey(); 
            if (state.human.dailyStats.date !== today) { 
                state.human.dailyStats = { date: today, tasks: 0, xp: 0, pages: 0, problems: 0, defs: 0, mockTests: 0, rankedMatches: 0, comboMax: 0 }; 
                state.human.quests.daily = { date: today, progress: {}, claimed: {} }; 
            } 
            const wk = weekKey(); 
            if (state.human.weeklyStats.week !== wk) { 
                state.human.weeklyStats = { week: wk, tasks: 0, xp: 0, mockTests: 0, rankedWins: 0 }; 
                state.human.quests.weekly = { week: wk, progress: {}, claimed: {} }; 
            } 
            
            if (state.human.combo > 0 && state.human.comboExpiry && Date.now() > state.human.comboExpiry) { 
                state.human.combo = 0; state.human.comboProgress = 0; state.human.comboExpiry = 0; 
            } 
            
            if (state.human.lastTaskDay) { 
                const lastDay = npDayStart(state.human.lastTaskDay); 
                const todayDate = npDayStart(today); 
                const diffDays = Math.floor((todayDate - lastDay) / (24*3600*1000)); 
                if (diffDays > 1) state.human.streak = 0; 
            } 
            
            // Tier is based on the human's rank in their currently-selected ranked category ladder.
            const catForTier = state.human.rankedCategory || 'assignments';
            const rpList = catalog.map(p => ({ id: p.id, rp: getCatRp(state, p.id, catForTier) })).sort((a,b) => b.rp - a.rp);
            const humanRankRP = rpList.findIndex(x => x.id === 'human') + 1;
            const newTier = computeTierForRank(humanRankRP);
            const tierOrder = { 'LT4':0,'HT4':1,'LT3':2,'HT3':3,'LT2':4,'HT2':5,'HT1':6,'HT1':7 };
            
            if (tierOrder[newTier] > tierOrder[state.human.highestTier]) { 
                const oldO = tierOrder[state.human.highestTier]; 
                state.human.highestTier = newTier; 
                for (let o = oldO + 1; o <= tierOrder[newTier]; o++) { 
                    const tn = TIER_ORDER[o], rw = TIER_REWARDS[tn] || {}, inv = state.human.inventory; 
                    inv.eggs += rw.eggs || 0; 
                    for (const pt of rw.potions || []) { 
                        const ex = inv.potions.find(x => x.type === pt); 
                        if (ex) ex.quantity++; 
                        else inv.potions.push({ type: pt, quantity: 1 }); 
                    } 
                    state.human.careerHistory.push({ ts: now, type: 'tier', note: 'Reached ' + tn }); 
                } 
            } 
            return state; 
        } 

        // ============================================================ // ACTIONS // ============================================================ 
        function doCompleteTask(state, catalog, taskType, taskId, baseXp, extraData = {}) { 
            const now = Date.now(); const h = state.human; const today = todayKey(); 
            if (h.lastTaskDay && h.lastTaskDay !== today) { h.combo = 0; h.comboProgress = 0; h.comboExpiry = 0; } 
            if (h.combo > 0 && h.comboExpiry && Date.now() > h.comboExpiry) { h.combo = 0; h.comboProgress = 0; h.comboExpiry = 0; } 
            
            const finalXp = calcTaskXp(baseXp, h, taskType); 
            h.xp += finalXp; h.tasksCompleted += 1; h.dailyStats.tasks += 1; h.dailyStats.xp += finalXp; h.weeklyStats.tasks += 1; h.weeklyStats.xp += finalXp; 
            if (taskType === 'assignment') h.assignmentsCompleted += 1; 
            if (taskId === 'recall_page') { h.recalledPages += 1; h.dailyStats.pages += 1; } 
            if (taskId === 'recall_problem') { h.numericalProblems += 1; h.dailyStats.problems += 1; } 
            if (taskId === 'recall_defs') { h.definitionsRecalled += 5; h.dailyStats.defs += 1; } 
            if (taskType === 'mock') { h.mockTestsCompleted += 1; h.dailyStats.mockTests += 1; h.weeklyStats.mockTests += 1; if (extraData.score) h.mockScoreSum += extraData.score; } 
            
            const potion = potionBonus(h); const comboThreshold = potion.comboDiscount ? 5 : 10; 
            h.comboProgress += 1; 
            if (h.comboProgress >= comboThreshold) { h.combo += 1; h.comboProgress = 0; if (h.combo > h.highestCombo) h.highestCombo = h.combo; if (h.combo > (h.dailyStats.comboMax||0)) h.dailyStats.comboMax = h.combo; } 
            h.comboExpiry = now + 2*3600*1000; 
            
            if (h.dailyStats.tasks === 1) { 
                const yest = npDate(); yest.setDate(yest.getDate()-1); 
                if (h.lastTaskDay === todayKey(yest) || h.streak === 0) { h.streak = h.streak === 0 ? 1 : h.streak + 1; } 
                else { h.streak = Math.max(1, h.streak); } 
                if (h.streak > h.longestStreak) h.longestStreak = h.streak; 
            } 
            h.lastTaskDay = today; 
            
            // Feed XP into active Ranked Match — but only if the task belongs to the battle's category.
            if (h.activeMatch && now < h.activeMatch.end) {
                if (taskCountsForCategory(taskType, taskId, h.activeMatch.category)) {
                    h.activeMatch.humanXp = (h.activeMatch.humanXp || 0) + finalXp;
                }
            }
            
            h.dailyXpLog[today] = (h.dailyXpLog[today] || 0) + finalXp; 
            
            const d = h.quests.daily.progress, w = h.quests.weekly.progress; 
            if (taskType === 'assignment') d.assignments = (d.assignments||0)+1; 
            if (taskId === 'recall_page') d.pages = (d.pages||0)+1; 
            if (taskId === 'recall_problem') d.problems = (d.problems||0)+1; 
            if (taskType === 'mock') { d.mockTests = (d.mockTests||0)+1; w.mockTests = (w.mockTests||0)+1; } 
            d.tasks = (d.tasks||0)+1; w.tasks = (w.tasks||0)+1; w.xp = h.weeklyStats.xp; 
            if (h.combo >= 5) d.comboFive = 1; 
            
            h.careerHistory.push({ ts: now, type: 'task', taskType, taskId, xp: finalXp }); 
            if (h.careerHistory.length > 500) h.careerHistory = h.careerHistory.slice(-500); 
            
            if (h.equippedPet) { 
                const pet = h.inventory.pets.find(p => p.instanceId === h.equippedPet); 
                if (pet) { 
                    pet.petXp += finalXp; 
                    while (pet.petXp >= pet.petXpNeeded && pet.level < 20) { 
                        pet.petXp -= pet.petXpNeeded; pet.level += 1; pet.petXpNeeded = Math.floor(pet.petXpNeeded * 1.4); 
                    } 
                } 
            } 
            
            const newTitleIdx = computeTitleIdx(h.xp); 
            if (newTitleIdx > h.highestTitle) { 
                const titlesGained = []; 
                for (let i = h.highestTitle + 1; i <= newTitleIdx; i++) titlesGained.push(i); 
                h.highestTitle = newTitleIdx; 
                for (const ti of titlesGained) { 
                    h.inventory.eggs += 1; 
                    h.careerHistory.push({ ts: now, type: 'title', title: TITLES[ti] }); 
                } 
            } 
            return finalXp; 
        } 

        function startRankedBattle(state, catalog, mode, category) {
            const h = state.human;
            if (h.activeMatch) return false;
            const cat = category || h.rankedCategory || 'assignments';
            const catMeta = RANKED_CAT_BY_ID[cat];
            if (!catMeta) return false;

            const myCatRp = getCatRp(state, 'human', cat);
            const opp = findClosestOpponent(myCatRp, state, catalog, cat);
            if (!opp) return false;

            const oppState = state.ai[opp.id];
            const oppDaily = opp.aiProfile.dailyXpAvg || 100;
            const energy = oppState ? oppState.energy : 1.0;
            // AI category heat biases how hard they push this ladder right now
            const heat = oppState && oppState.catHeat ? (oppState.catHeat[cat] || 0) : 0;
            const heatMul = 0.7 + Math.min(0.9, heat * 0.15);
            // Calculate expected XP the opponent will earn over the battle duration
            const targetOppXp = Math.max(15, Math.floor(oppDaily * (mode.hours / 24) * 2.2 * energy * heatMul * rand(Math.random, 0.75, 1.35)));

            const now = Date.now();
            h.activeMatch = {
                id: 'rm_' + now,
                modeId: mode.id,
                modeName: mode.name,
                category: cat,
                categoryIcon: catMeta.icon,
                categoryName: catMeta.name,
                hours: mode.hours,
                start: now,
                end: now + mode.hours * 3600000,
                opponentId: opp.id,
                humanXp: 0,
                targetOppXp
            };
            h.dailyStats.rankedMatches = (h.dailyStats.rankedMatches || 0) + 1;
            return true;
        }

        function hatchEgg(state) { 
            const h = state.human; if (h.inventory.eggs <= 0) return null; 
            h.inventory.eggs -= 1; 
            const titleIdx = computeTitleIdx(h.xp); 
            let eggPool; 
            if (titleIdx >= 40) eggPool = EGGS; 
            else if (titleIdx >= 30) eggPool = EGGS.slice(0, 5); 
            else if (titleIdx >= 20) eggPool = EGGS.slice(0, 4); 
            else if (titleIdx >= 10) eggPool = EGGS.slice(0, 3); 
            else if (titleIdx >= 5) eggPool = EGGS.slice(0, 2); 
            else eggPool = EGGS.slice(0, 1); 
            const egg = pick(Math.random, eggPool); 
            const rng = mulberry32(Math.floor(Math.random()*1e9)); 
            const pet = rollPetFromEgg(egg, rng); 
            const newPet = { instanceId: 'pet_' + Date.now() + '_' + Math.floor(Math.random()*1000), petName: pet.name, eggId: egg.id, emoji: pet.emoji, rarity: pet.rar, ability: pet.ab, val: pet.val, flavor: pet.flavor, level: 1, petXp: 0, petXpNeeded: 100, acquired: Date.now() }; 
            h.inventory.pets.push(newPet); 
            h.careerHistory.push({ ts: Date.now(), type: 'pet', note: `Hatched ${pet.name} (${pet.rar})` }); 
            return newPet; 
        } 

        // ============================================================ // LEADERBOARD BUILDERS // ============================================================ 
        function buildXPLeaderboard(state, catalog) {
            const rows = catalog.map(p => ({ id: p.id, name: getProfile(p.id, catalog, state).name, username: p.username, nationality: p.nationality, vip: p.vip, vipTier: p.vipTier, xp: p.id === 'human' ? state.human.xp : (state.ai[p.id]?.xp ?? 0) }));
            rows.sort((a,b) => b.xp - a.xp || a.id.localeCompare(b.id));
            rows.forEach((r, i) => { r.rank = i + 1; r.titleIdx = computeTitleIdx(r.xp); r.title = TITLES[r.titleIdx]; });

        // when omitted, ranks by the legacy "best category" mirror (ai.rp / human.rp currency) so
        // existing callers that don't pass a category keep working.
        function buildRPLeaderboard(state, catalog, category) {

            const rows = catalog.map(p => ({ id: p.id, name: getProfile(p.id, catalog, state).name, username: p.username, nationality: p.nationality, vip: p.vip, vipTier: p.vipTier, rp: getRp(p.id) }));
            rows.sort((a,b) => b.rp - a.rp || a.id.localeCompare(b.id));
            rows.forEach((r, i) => { r.rank = i + 1; r.tier = computeTierForRank(r.rank); });

        // ============================================================ // SAVE & WELCOME MODALS // ============================================================ 
function SaveModal({ state, onExport, onImport, onClose, toast }) {
    const fileRef = useRef(null);
    const [handle, setHandle] = useState(null);
    const [needsPermission, setNeedsPermission] = useState(false);
    const [busy, setBusy] = useState(false);

    useEffect(() => {
        (async () => {
            const res = await getSaveFileHandle();
            if (!res) return;
            if (res.needsPermission) { setHandle(res.handle); setNeedsPermission(true); }
            else setHandle(res);
        })();
    }, []);

    const ensurePermission = async (h) => {
        try {
            let p = await h.queryPermission({ mode: 'readwrite' });
            if (p === 'granted') return true;
            p = await h.requestPermission({ mode: 'readwrite' });
            return p === 'granted';
        } catch { return false; }
    };

    const handleConnect = async () => {
        setBusy(true);
        const h = await pickSaveFile();
        setBusy(false);
        if (h) { setHandle(h); setNeedsPermission(false); toast?.('✅ Connected academia.json'); }
    };

    const handleSave = async () => {
        if (!handle) return;
        setBusy(true);
        try {
            if (!(await ensurePermission(handle))) { toast?.('❌ Permission denied.'); setBusy(false); return; }
            await writeToHandle(handle, state);
            setNeedsPermission(false);
            toast?.('💾 Saved to academia.json');
        } catch (e) { toast?.('❌ Save failed: ' + e.message); }
        setBusy(false);
    };

    const handleLoad = async () => {
        if (!handle) return;
        setBusy(true);
        try {
            if (!(await ensurePermission(handle))) { toast?.('❌ Permission denied.'); setBusy(false); return; }
            const parsed = await readFromHandle(handle);
            if (parsed?.version !== STATE_VERSION) {
                toast?.(`⚠ Save is v${parsed?.version}, expected v${STATE_VERSION}.`);
                setBusy(false); return;
            }
            localStorage.setItem(SAVE_KEY, JSON.stringify(parsed));
            toast?.('✅ Loaded. Reloading…');
            setTimeout(() => window.location.reload(), 600);
        } catch (e) { toast?.('❌ Load failed: ' + e.message); }
        setBusy(false);
    };

    const handleForget = async () => {
        await idbDel(SAVE_FILE_HANDLE_KEY);
        setHandle(null); setNeedsPermission(false);
        toast?.('Disconnected.');
    };

    return (
        <div className="ac-modal-bg" onClick={onClose}>
            <div className="ac-modal" onClick={e => e.stopPropagation()}>
                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 8 }}>💾 Save & Load</div>

                <div style={{ fontSize: 12, color: S.muted, marginBottom: 16, lineHeight: 1.6, padding: 12, background: S.bg2, borderRadius: 10, border: `1px solid ${S.border}` }}>
                    <strong style={{ color: S.pink }}>Persistent mode:</strong> connect one
                    <code style={{ color: S.lavender }}> academia.json </code>
                    on disk. After that, Save overwrites it silently — no downloads, no (1)/(2).
                    {!HAS_FSA && <div style={{ marginTop: 8, color: S.danger }}>⚠ Browser doesn't support it. Use classic backup below.</div>}
                </div>

                {HAS_FSA && (
                    <Card style={{ marginBottom: 12, borderColor: handle ? S.mint : S.border }}>
                        <div style={{ fontSize: 11, color: S.muted, marginBottom: 6 }}>PERSISTENT FILE</div>
                        {!handle ? (
                            <button className="ac-btn ac-btn-primary" style={{ width: '100%' }} disabled={busy} onClick={handleConnect}>
                                {busy ? 'Connecting…' : '🔗 Connect academia.json'}
                            </button>
                        ) : (
                            <div>
                                <div style={{ fontSize: 13, marginBottom: 8 }}>
                                    <strong style={{ color: S.mint }}>● Connected</strong>
                                    <span style={{ color: S.muted }}> · {handle.name || 'academia.json'}</span>

        // ============================================================ // UNIVERSAL PROFILE MODAL // ============================================================
        function ProfileModal({ playerId, state, catalog, lbXP, lbRP, lbRPByCat, onClose, onSaveProfile }) {
            const isHuman = playerId === 'human';
            const baseProfile = getProfile(playerId, catalog, state);
            const [name, setName] = useState(baseProfile.name);
            const [username, setUsername] = useState(baseProfile.username);
            const [bio, setBio] = useState(baseProfile.bio || '');
            const [motto, setMotto] = useState(baseProfile.motto || '');
            const [avatar, setAvatar] = useState(baseProfile.avatar || '🦊');

            const xp = isHuman ? state.human.xp : (state.ai[playerId]?.xp || 0);
            const titleIdx = computeTitleIdx(xp);

            const xpRank = lbXP.find(r => r.id === playerId)?.rank || '?';
            // Per-category RP + rank. Default to the human's selected category for the headline tier.
            const selCat = (isHuman ? state.human.rankedCategory : 'assignments') || 'assignments';
            const catRp = {};
            const catRank = {};
            for (const c of RANKED_CATEGORIES) {
                catRp[c.id] = getCatRp(state, playerId, c.id);
                catRank[c.id] = (lbRPByCat && lbRPByCat[c.id]) ? (lbRPByCat[c.id].find(r => r.id === playerId)?.rank || '?') : '?';
            }
            const rp = catRp[selCat];
            const rpRank = catRank[selCat];
            const tier = computeTierForRank(typeof rpRank === 'number' ? rpRank : 1000); 

            const save = () => {
                if (!name.trim() || !username.trim()) return;
                onSaveProfile({ name: name.trim(), username: username.trim(), bio: bio.trim(), motto: motto.trim(), avatar });
                onClose();
            };

            return ( 
                <div className="ac-modal-bg" onClick={onClose}> 
                    <div className="ac-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 500 }}> 
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 16 }}>

                            <button className="ac-btn" onClick={onClose}>✕</button> 
                        </div> 
                        <div style={{ textAlign:'center', marginBottom: 20 }}> 
                            <div style={{ fontSize: 64, marginBottom: 8 }}>{avatar}</div> 
                            {isHuman ? ( 
                                <div className="ac-col" style={{ gap: 8, marginTop: 8 }}> 
                                    <input className="ac-input" value={name} onChange={e => setName(e.target.value)} placeholder="Display Name" maxLength={30} /> 
                                    <input className="ac-input" value={username} onChange={e => setUsername(e.target.value)} placeholder="Username" maxLength={20} /> 
                                    <input className="ac-input" value={motto} onChange={e => setMotto(e.target.value)} placeholder="Motto" maxLength={50} /> 
                                    <textarea className="ac-input" value={bio} onChange={e => setBio(e.target.value)} placeholder="Short Bio" maxLength={200} style={{ resize:'none', height: 60 }} /> 
                                    <div style={{ display:'flex', gap: 8, justifyContent:'center', marginTop: 8 }}> 
                                        {AVATARS.map(av => ( 
                                            <button key={av} className={`ac-btn ${avatar===av?'ac-btn-primary':''}`} style={{ fontSize: 20, padding: 8 }} onClick={() => setAvatar(av)}>{av}</button> 
                                        ))} 
                                    </div> 
                                </div> 
                            ) : ( 
                                <div> 
                                    <div style={{ fontSize: 20, fontWeight: 700 }}>{baseProfile.name} {baseProfile.vip && <VIPBadge />}</div> 
                                    <div style={{ fontSize: 12, color: S.muted }}>@{baseProfile.username} · {baseProfile.nationality}</div> 
                                    <div style={{ fontSize: 13, fontStyle:'italic', marginTop: 6, color: S.lavender }}>“{baseProfile.motto || baseProfile.bio}”</div> 
                                </div> 
                            )} 
                        </div> 
                        <div className="ac-grid" style={{ gridTemplateColumns:'1fr 1fr', marginBottom: 16 }}> 
                            <Card><div style={{ fontSize: 11, color: S.muted }}>XP & RANK</div><div style={{ fontSize: 16, fontWeight: 700, color: S.lavender }}>{fmtInt(xp)} <span style={{ fontSize: 12, color: S.muted }}>(#{xpRank})</span></div><div style={{ fontSize: 11, color: S.gold, marginTop: 2 }}>{TITLES[titleIdx]}</div></Card> 
                            <Card>
                                <div style={{ fontSize: 11, color: S.muted, marginBottom: 4 }}>RANKED LADDERS</div>
                                {RANKED_CATEGORIES.map(c => (
                                    <div key={c.id} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 0', borderBottom: `1px solid ${S.border}`, fontSize: 12 }}>
                                        <span style={{ color: c.color, fontWeight: 700 }}>{c.icon} {c.name}</span>
                                        <span style={{ color: S.gold, fontWeight: 700 }}>{fmtRp(catRp[c.id])} RP <span style={{ color: S.muted, fontSize: 11 }}>#{catRank[c.id]}</span></span>
                                    </div>
                                ))}
                                <div style={{ fontSize: 11, color: S.mint, marginTop: 6 }}>Tier {tier} · ({(RANKED_CAT_BY_ID[selCat]||{}).name || selCat})</div>
                            </Card>

                            <div style={{ fontSize: 11, color: S.muted, marginTop: 8, marginBottom: 4 }}>BIO</div> 
                            <div style={{ fontSize: 12, color: S.text }}>{baseProfile.bio || 'No bio provided.'}</div>

                        {isHuman && ( 
                            <button className="ac-btn ac-btn-primary" style={{ width:'100%' }} onClick={save}>Save Changes</button> 
                        )}

                </div> 
            ); 
        }

        // ============================================================ // STUDYING TOOLS // ============================================================ 
        // Three personal study utilities that live inside the game:
        //   📖 Definitions — nested subject folders holding head-word definitions
        //   ✏️ Rough       — a scratchpad that saves whatever you type
        //   📋 Homeworks   — plan homework by priority and due date
        // All data lives in state.human.studyTools and persists with the normal
        // save system (localStorage autosave + exported academia.json).

        const HW_PRIORITIES = { high:{ label:'High', icon:'🔥', color:'#f38ba8', order:0 }, medium:{ label:'Medium', icon:'⭐', color:'#f5d78e', order:1 }, low:{ label:'Low', icon:'🌿', color:'#a8e6cf', order:2 } };

        // ---- Definitions folder-tree helpers ----
        function folderChildren(folders, parentId) { return folders.filter(f => f.parentId === parentId); } 
        function folderDescendants(folders, id) { const out = []; const walk = pid => { folders.forEach(f => { if (f.parentId === pid) { out.push(f.id); walk(f.id); } }); }; walk(id); return out; } 
        function folderPath(folders, id) { const byId = {}; folders.forEach(f => { byId[f.id] = f; }); const path = []; let cur = byId[id]; while (cur) { path.unshift(cur); cur = cur.parentId ? byId[cur.parentId] : null; } return path; } 
        function foldersIndented(folders) { const out = []; const walk = (parentId, depth) => { folderChildren(folders, parentId).slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(f => { out.push({ ...f, depth }); walk(f.id, depth + 1); }); }; walk(null, 0); return out; } 
        function countDefsRecursive(defs, folders, folderId) { const ids = [folderId].concat(folderDescendants(folders, folderId)); return defs.filter(d => ids.indexOf(d.folderId) >= 0).length; } 

        // ---- Small shared pieces ----
        function STEmpty({ icon, title, sub }) { 
            return ( 
                <div style={{ textAlign:'center', padding: '36px 16px', color: S.muted }}> 
                    <div style={{ fontSize: 40, marginBottom: 10 }}>{icon}</div> 
                    <div style={{ fontSize: 15, fontWeight: 700, color: S.text, marginBottom: 4 }}>{title}</div> 
                    <div style={{ fontSize: 13, lineHeight: 1.5, maxWidth: 420, margin: '0 auto' }}>{sub}</div> 
                </div> 
            ); 
        } 

        function STConfirmModal({ title, body, confirmLabel, onConfirm, onClose }) {

                <div className="ac-modal-bg" onClick={onClose}> 
                    <div className="ac-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 440 }}> 
                        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 8 }}>{title}</div> 
                        <div style={{ fontSize: 13, color: S.muted, marginBottom: 18, lineHeight: 1.55 }}>{body}</div>

                            <button className="ac-btn" style={{ flex: 1 }} onClick={onClose}>Cancel</button> 
                            <button className="ac-btn" style={{ flex: 1, background: S.danger+'22', borderColor: S.danger+'66', color: S.danger }} onClick={() => { onConfirm(); onClose(); }}>{confirmLabel || 'Delete'}</button> 
                        </div> 
                    </div> 
                </div> 
            ); 
        } 

        function STFolderModal({ title, initial, onSave, onClose }) { 
            const [name, setName] = useState(initial || ''); 
            const save = () => { const n = name.trim(); if (!n) return; onSave(n); onClose(); };

                <div className="ac-modal-bg" onClick={onClose}>

                        <input className="ac-input" autoFocus placeholder="Folder name (e.g. Biology)" value={name} maxLength={60} onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') save(); }} />

                        </div> 
                    </div> 
                </div>

        function STDefModal({ title, def, folders, defaultFolderId, onSave, onClose }) {

            const [body, setBody] = useState(def ? def.body : ''); 
            const [folderId, setFolderId] = useState(def ? def.folderId : (defaultFolderId || null)); 
            const options = [{ id: null, name: 'Root (top level)', depth: 0 }].concat(foldersIndented(folders)); 
            const save = () => { const hd = head.trim(), bd = body.trim(); if (!hd || !bd) return; onSave({ headWord: hd, body: bd, folderId }); onClose(); }; 
            return ( 
                <div className="ac-modal-bg" onClick={onClose}> 
                    <div className="ac-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}>

                        <div style={{ fontSize: 12, color: S.muted, marginBottom: 6 }}>Head word</div> 
                        <input className="ac-input" autoFocus placeholder="The term to define (e.g. Osmosis)" value={head} maxLength={80} onChange={e => setHead(e.target.value)} /> 
                        <div style={{ fontSize: 12, color: S.muted, margin: '12px 0 6px' }}>Definition</div> 
                        <textarea className="ac-input" style={{ minHeight: 110, resize: 'vertical', lineHeight: 1.55 }} placeholder="Write the definition in your own words…" value={body} maxLength={2000} onChange={e => setBody(e.target.value)} />

                        <select className="ac-input" value={folderId || ''} onChange={e => setFolderId(e.target.value || null)}>

                        <div style={{ display:'flex', gap: 10, marginTop: 18 }}>

        } 

        function STMoveModal({ title, folders, excludeIds, currentId, onPick, onClose }) {

        // --- ST: Definitions & Rough tools ---
        function DefinitionsTool({ st, update, toast }) {

            const deleteDef = (d) => { update(s => { const T = s.human.studyTools.defs; T.defs = T.defs.filter(x => x.id !== d.id); }); toast(`🗑️ “${d.headWord}” deleted`); }; 
            const moveItem = (kind, id, destId) => { 
                update(s => { 
                    const T = s.human.studyTools.defs; 
                    if (kind === 'folder') { const t = T.folders.find(x => x.id === id); if (t) t.parentId = destId; if (T.lastFolderId === id) T.lastFolderId = destId; }

            const searching = q.trim().length > 0;

            const resultDefs = searching ? D.defs.filter(d => d.headWord.toLowerCase().indexOf(ql) >= 0 || d.body.toLowerCase().indexOf(ql) >= 0) : []; 
            const resultFolders = searching ? D.folders.filter(f => f.name.toLowerCase().indexOf(ql) >= 0) : []; 

            const folderCard = (f, withPath) => {

                            <button className="ac-btn" style={{ padding:'5px 10px', fontSize: 11 }} onClick={() => setMove({ kind:'folder', id: f.id, name: f.name, excludeIds: [f.id].concat(folderDescendants(D.folders, f.id)), currentId: f.parentId })}>📦 Move</button> 
                            <button className="ac-btn" style={{ padding:'5px 10px', fontSize: 11, color: S.danger, borderColor: S.danger+'55' }} onClick={() => setDel({ kind:'folder', item: f })}>🗑️</button> 
                        </div> 
                    </Card> 
                ); 
            }; 

            const defCard = (d, withPath) => { 
                const path = d.folderId ? folderPath(D.folders, d.folderId).map(p => p.name).join(' › ') : 'Root'; 
                return ( 
                    <Card key={d.id}> 
                        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 6, color: S.lavender, overflowWrap:'anywhere' }}>{d.headWord}</div> 
                        <div style={{ fontSize: 13, opacity: .85, lineHeight: 1.55, marginBottom: 10, display: '-webkit-box', WebkitLineClamp: 4, WebkitBoxOrient: 'vertical', overflow: 'hidden', overflowWrap:'anywhere' }}>{d.body}</div> 
                        {withPath && <div style={{ fontSize: 11, color: S.muted, marginBottom: 8 }}>📍 {path}</div>} 
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap: 6 }}> 
                            <button className="ac-btn" style={{ padding:'5px 10px', fontSize: 11 }} onClick={() => setDefModal({ title: 'Edit Definition', def: d, onSave: data => saveDef(data, d) })}>✏️ Edit</button> 
                            <div style={{ display:'flex', gap: 6 }}> 
                                <button className="ac-btn" style={{ padding:'5px 10px', fontSize: 11 }} title="Move to another folder" onClick={() => setMove({ kind:'def', id: d.id, name: d.headWord, excludeIds: [], currentId: d.folderId })}>📦</button> 
                                <button className="ac-btn" style={{ padding:'5px 10px', fontSize: 11, color: S.danger, borderColor: S.danger+'55' }} onClick={() => setDel({ kind:'def', item: d })}>🗑️</button> 
                            </div> 
                        </div> 
                    </Card> 
                ); 
            }; 

            const delBody = del && del.kind === 'folder' ? (() => { 
                const ids = [del.item.id].concat(folderDescendants(D.folders, del.item.id)); 
                const nF = ids.length - 1, nD = D.defs.filter(d => ids.indexOf(d.folderId) >= 0).length; 
                return `“${del.item.name}” and everything inside it will be removed — ${nF} subfolder${nF === 1 ? '' : 's'} and ${nD} definition${nD === 1 ? '' : 's'}. This cannot be undone.`; 
            })() : del ? `“${del.item.headWord}” will be removed permanently.` : ''; 

            return ( 
                <div> 
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap: 10, marginBottom: 12 }}> 
                        <div style={{ display:'flex', alignItems:'center', gap: 4, flexWrap:'wrap', fontSize: 13, minWidth: 0 }}> 
                            <span onClick={() => go(null)} style={{ cursor:'pointer', color: cur ? S.lavender : S.text, fontWeight: 700 }}>📚 All Folders</span> 
                            {crumbs.map(f => ( 
                                <span key={f.id} style={{ display:'inline-flex', alignItems:'center', gap: 4 }}> 
                                    <span style={{ color: S.muted }}>›</span> 
                                    <span onClick={() => go(f.id)} style={{ cursor:'pointer', color: f.id === cur ? S.text : S.lavender, fontWeight: 700 }}>{f.name}</span> 
                                </span> 
                            ))} 
                        </div> 
                        <div style={{ display:'flex', gap: 8 }}> 
                            <button className="ac-btn" onClick={() => setFolderModal({ title: 'New Folder', initial: '', onSave: addFolder })}>📁 + Folder</button> 
                            <button className="ac-btn ac-btn-primary" onClick={() => setDefModal({ title: 'New Definition', def: null, onSave: data => saveDef(data, null) })}>📝 + Definition</button> 
                        </div> 
                    </div> 
                    <input className="ac-input" style={{ marginBottom: 16 }} placeholder={`🔍 Search ${D.defs.length} definition${D.defs.length === 1 ? '' : 's'} and ${D.folders.length} folder${D.folders.length === 1 ? '' : 's'}…`} value={q} onChange={e => setQ(e.target.value)} /> 
                    {searching ? ( 
                        <div> 
                            <div style={{ fontSize: 12, color: S.muted, marginBottom: 10 }}>{resultFolders.length + resultDefs.length} result{(resultFolders.length + resultDefs.length) === 1 ? '' : 's'} for “{q.trim()}”</div> 
                            {resultFolders.length > 0 && <div className="ac-grid" style={{ gridTemplateColumns:'repeat(auto-fit, minmax(230px, 1fr))', marginBottom: 12 }}>{resultFolders.map(f => folderCard(f, true))}</div>} 
                            {resultDefs.length > 0 && <div className="ac-grid" style={{ gridTemplateColumns:'repeat(auto-fit, minmax(260px, 1fr))' }}>{resultDefs.map(d => defCard(d, true))}</div>} 
                            {resultFolders.length + resultDefs.length === 0 && <STEmpty icon="🔍" title="No matches" sub="Nothing matched your search. Try another word or check the spelling." />} 
                        </div> 
                    ) : ( 
                        <div> 
                            <div style={{ fontSize: 12, fontWeight: 700, color: S.muted, letterSpacing: '.5px', textTransform: 'uppercase', margin: '2px 0 10px' }}>Folders ({subFolders.length})</div> 
                            {subFolders.length > 0 ? ( 
                                <div className="ac-grid" style={{ gridTemplateColumns:'repeat(auto-fit, minmax(230px, 1fr))', marginBottom: 18 }}>{subFolders.map(f => folderCard(f, false))}</div> 
                            ) : ( 
                                <div style={{ fontSize: 13, color: S.muted, lineHeight: 1.6, marginBottom: 18, padding: '14px 16px', background: S.bg2, border: `1px dashed ${S.border}`, borderRadius: 12 }}> 
                                    {cur === null ? 'No folders yet. Create one for each subject — e.g. Biology, History, Maths. Folders can hold other folders, so you can organise by “Biology › Chapter 1”.' : 'No subfolders here. Use “+ Definition” to store definitions in this folder, or “+ Folder” to nest another folder inside.' } 
                                </div>

                            <div style={{ fontSize: 12, fontWeight: 700, color: S.muted, letterSpacing: '.5px', textTransform: 'uppercase', margin: '2px 0 10px' }}>Definitions in this folder ({hereDefs.length})</div> 
                            {hereDefs.length > 0 ? ( 
                                <div className="ac-grid" style={{ gridTemplateColumns:'repeat(auto-fit, minmax(260px, 1fr))' }}>{hereDefs.map(d => defCard(d, false))}</div>

                            )}

                    )} 
                    {folderModal && <STFolderModal {...folderModal} onClose={() => setFolderModal(null)} />} 
                    {defModal && <STDefModal {...defModal} folders={D.folders} defaultFolderId={cur} onClose={() => setDefModal(null)} />} 
                    {move && <STMoveModal title={`Move “${move.name}”`} folders={D.folders} excludeIds={move.excludeIds} currentId={move.currentId} onPick={destId => moveItem(move.kind, move.id, destId)} onClose={() => setMove(null)} />} 
                    {del && <STConfirmModal title={del.kind === 'folder' ? `Delete “${del.item.name}”?` : `Delete “${del.item.headWord}”?`} body={delBody} onConfirm={() => { if (del.kind === 'folder') deleteFolder(del.item); else deleteDef(del.item); }} onClose={() => setDel(null)} />} 
                </div> 
            ); 
        } 

        function RoughTool({ st, update, toast }) { 
            const [text, setText] = useState((st.rough && st.rough.text) || ''); 
            const [dirty, setDirty] = useState(false); 
            const [savedAt, setSavedAt] = useState((st.rough && st.rough.updatedAt) || 0); 
            const [confirmClear, setConfirmClear] = useState(false); 
            const timer = useRef(null); 
            const latest = useRef({}); 
            latest.current = { text, dirty }; 
            const persistState = (v) => { update(s => { s.human.studyTools.rough = { text: v, updatedAt: Date.now() }; }); }; 
            const persist = (v) => { persistState(v); setSavedAt(Date.now()); setDirty(false); }; 
            const onChange = (v) => { 
                setText(v); setDirty(true); 
                if (timer.current) clearTimeout(timer.current); 
                timer.current = setTimeout(() => { timer.current = null; persist(v); }, 600); 
            }; 
            const flush = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } if (latest.current.dirty) persist(latest.current.text); }; 
            useEffect(() => () => { if (timer.current) clearTimeout(timer.current); if (latest.current.dirty) persistState(latest.current.text); }, []); 
            const words = text.trim() ? text.trim().split(/\s+/).length : 0; 
            const copy = () => { 
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('📋 Copied to clipboard!')).catch(() => toast('Copy failed')); 
                else toast('Copy is not available here'); 
            }; 
            return ( 
                <div> 
                    <Card> 
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap: 8, marginBottom: 10 }}> 
                            <div style={{ fontSize: 12, color: S.muted }}> 
                                {dirty ? <span style={{ color: S.gold }}>✍️ Writing — saves automatically…</span> 
                                    : savedAt ? <span style={{ color: S.mint }}>✅ Saved · {new Date(savedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span> 
                                    : 'Type anything you like — it saves automatically.'} 
                            </div> 
                            <div style={{ display:'flex', gap: 8 }}> 
                                <button className="ac-btn" style={{ padding:'6px 12px', fontSize: 12 }} disabled={!text} onClick={copy}>📋 Copy</button> 
                                <button className="ac-btn" style={{ padding:'6px 12px', fontSize: 12, color: S.danger, borderColor: S.danger+'55' }} disabled={!text} onClick={() => setConfirmClear(true)}>🧹 Clear</button> 
                            </div> 
                        </div> 
                        <textarea className="ac-input" style={{ minHeight: 380, resize: 'vertical', lineHeight: 1.7, fontSize: 14 }} placeholder="Jot down anything — formulas, ideas, reminders, essay drafts… Everything is kept safe in your save file." value={text} onChange={e => onChange(e.target.value)} onBlur={flush} /> 
                        <div style={{ display:'flex', justifyContent:'space-between', fontSize: 11, color: S.muted, marginTop: 8 }}> 
                            <span>{words} word{words === 1 ? '' : 's'} · {text.length} character{text.length === 1 ? '' : 's'}</span> 
                            <span>✏️ Rough</span> 
                        </div> 
                    </Card> 
                    {confirmClear && <STConfirmModal title="Clear the Rough pad?" body="Everything you have typed here will be erased. This cannot be undone." confirmLabel="Clear it" onConfirm={() => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } persist(''); setText(''); }} onClose={() => setConfirmClear(false)} />} 
                </div> 
            ); 
        } 
        // --- ST: Homeworks tool & main tab ---
        function HomeworksTool({ st, update, toast }) { 
            const HWs = st.homeworks || []; 
            const [form, setForm] = useState(null); 
            const [filter, setFilter] = useState('active'); 
            const [sortMode, setSortMode] = useState('priority'); 
            const [del, setDel] = useState(null); 

            const todayMs = npDayStart(todayKey()); 
            const dueMs = hw => hw.due ? npDayStart(hw.due) : Infinity; 
            const fmtDue = ds => new Date(ds + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); 
            const prOrder = p => (HW_PRIORITIES[p] || HW_PRIORITIES.medium).order; 

            const active = HWs.filter(h => !h.done); 
            const doneHws = HWs.filter(h => h.done); 
            const overdue = active.filter(h => h.due && dueMs(h) < todayMs); 
            const dueToday = active.filter(h => h.due && dueMs(h) === todayMs); 

            const openNew = () => setForm({ id: null, title: '', subject: '', due: '', priority: 'medium', notes: '' }); 
            const openEdit = hw => setForm({ id: hw.id, title: hw.title, subject: hw.subject || '', due: hw.due || '', priority: hw.priority || 'medium', notes: hw.notes || '' }); 
            const saveForm = () => { 
                const t = form.title.trim(); if (!t) return; 
                if (form.id) { 
                    update(s => { const it = s.human.studyTools.homeworks.find(x => x.id === form.id); if (it) { it.title = t; it.subject = form.subject.trim(); it.due = form.due || null; it.priority = form.priority; it.notes = form.notes.trim(); } }); 
                    toast('✏️ Homework updated');

                    update(s => { s.human.studyTools.homeworks.push({ id: uid(), title: t, subject: form.subject.trim(), due: form.due || null, priority: form.priority, notes: form.notes.trim(), done: false, createdAt: Date.now(), completedAt: null }); });

                    if (a.done && b.done) return (b.completedAt || 0) - (a.completedAt || 0); 
                    if (sortMode === 'due') { if (dueMs(a) !== dueMs(b)) return dueMs(a) - dueMs(b); return prOrder(a.priority) - prOrder(b.priority); }

                        </div> 
                        <div style={{ display:'flex', gap: 4, alignItems:'center', flexWrap:'wrap' }}> 
                            <span style={{ fontSize: 11, color: S.muted }}>Sort</span> 
                            {[['priority', '⚡ Priority'], ['due', '📅 Due date']].map(([k, l]) => ( 
                                <button key={k} className={`ac-tab ${sortMode === k ? 'active' : ''}`} onClick={() => setSortMode(k)}>{l}</button> 
                            ))} 
                            <button className="ac-btn ac-btn-primary" onClick={openNew}>+ Add Homework</button> 
                        </div> 
                    </div> 
                    {overdue.length > 0 && <div style={{ padding: '10px 14px', borderRadius: 10, background: S.danger+'15', border: `1px solid ${S.danger}44`, color: S.danger, fontSize: 13, fontWeight: 600, marginBottom: 12 }}>⚠️ {overdue.length} homework item{overdue.length === 1 ? '' : 's'} past it{overdue.length === 1 ? 's' : ''} due date.</div>}

                    {visible.length > 0 ? ( 
                        <div className="ac-col">{visible.map(hwCard)}</div> 
                    ) : ( 
                        <STEmpty icon="📋" title={filter === 'active' ? (HWs.length ? 'All clear — everything is done!' : 'No homework yet') : (filter === 'done' ? 'Nothing completed yet' : 'No homework yet')} sub={filter === 'active' ? (HWs.length ? 'Everything on your list is completed. Enjoy the break or review the Done tab.' : 'Add your homework with “+ Add Homework”, set a priority and a due date, and it will stay organised for you.') : 'Homework you add will show up here.'} /> 
                    )} 
                    {form && ( 
                        <div className="ac-modal-bg" onClick={() => setForm(null)}> 
                            <div className="ac-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}> 
                                <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 14 }}>{form.id ? 'Edit Homework' : 'New Homework'}</div> 
                                <div style={{ fontSize: 12, color: S.muted, marginBottom: 6 }}>Title *</div> 
                                <input className="ac-input" autoFocus placeholder="e.g. Maths worksheet 4.2" value={form.title} maxLength={120} onChange={e => setForm({ ...form, title: e.target.value })} /> 
                                <div className="ac-grid" style={{ gridTemplateColumns:'1fr 1fr', gap: 10, marginTop: 12 }}> 
                                    <div> 
                                        <div style={{ fontSize: 12, color: S.muted, marginBottom: 6 }}>Subject</div> 
                                        <input className="ac-input" placeholder="e.g. Maths" value={form.subject} maxLength={40} onChange={e => setForm({ ...form, subject: e.target.value })} /> 
                                    </div> 
                                    <div> 
                                        <div style={{ fontSize: 12, color: S.muted, marginBottom: 6 }}>Due date</div> 
                                        <input type="date" className="ac-input" value={form.due} onChange={e => setForm({ ...form, due: e.target.value })} /> 
                                    </div> 
                                </div> 
                                <div style={{ fontSize: 12, color: S.muted, margin: '12px 0 6px' }}>Priority</div> 
                                <div style={{ display:'flex', gap: 8 }}> 
                                    {Object.keys(HW_PRIORITIES).map(p => { const P = HW_PRIORITIES[p]; const on = form.priority === p; return ( 
                                        <button key={p} type="button" className="ac-btn" style={{ flex: 1, background: on ? P.color+'22' : S.panel2, borderColor: on ? P.color : S.border, color: on ? P.color : S.muted, fontWeight: 700 }} onClick={() => setForm({ ...form, priority: p })}>{P.icon} {P.label}</button> 
                                    ); })} 
                                </div> 
                                <div style={{ fontSize: 12, color: S.muted, margin: '12px 0 6px' }}>Notes (optional)</div> 
                                <textarea className="ac-input" style={{ minHeight: 70, resize: 'vertical', lineHeight: 1.5 }} placeholder="Pages, chapters, links…" value={form.notes} maxLength={500} onChange={e => setForm({ ...form, notes: e.target.value })} /> 
                                <div style={{ display:'flex', gap: 10, marginTop: 18 }}> 
                                    <button className="ac-btn" style={{ flex: 1 }} onClick={() => setForm(null)}>Cancel</button> 
                                    <button className="ac-btn ac-btn-primary" style={{ flex: 1 }} disabled={!form.title.trim()} onClick={saveForm}>{form.id ? 'Save Changes' : 'Add Homework'}</button> 
                                </div> 
                            </div> 
                        </div> 
                    )} 
                    {del && <STConfirmModal title={`Delete “${del.title}”?`} body="This homework will be removed permanently." onConfirm={() => remove(del)} onClose={() => setDel(null)} />} 
                </div> 
            ); 
        } 

        // --- ST: 3·2·1 lock-in ritual ---
        function Tool321({ st, update, toast, onNav }) { 
            const INK = '#08080c';                      // pitch-black text on pastel
            const INK_SOFT = 'rgba(8,8,12,.62)';        // muted black for secondary text
            const PILL = { background: 'rgba(255,255,255,.94)', color: INK, border: `1.5px solid ${INK}`, boxShadow: `0 3px 0 ${INK}` };  // pressable sticker button
            const T = st.t321 || { count: 0, lastAt: 0 }; 
            const [phase, setPhase] = useState('idle');   // 'idle' | 3 | 2 | 1 | 'locked'
            const STEPS = { 
                3: { deep: '#7d66d9', bg: 'linear-gradient(165deg,#ece4ff 0%,#d7c6fd 100%)', word: 'Sit up. Shoulders down.', emoji: '🌸', note: 392 }, 
                2: { deep: '#d5568f', bg: 'linear-gradient(165deg,#ffe6f1 0%,#fbcbe3 100%)', word: 'Phone away. Desk clear.', emoji: '🫧', note: 494 }, 
                1: { deep: '#4d88c7', bg: 'linear-gradient(165deg,#e2f0fc 0%,#c6dcf3 100%)', word: 'One deep breath in…', emoji: '💗', note: 587 } 
            }; 
            const begin = () => { FX.play('click'); setPhase(3); }; 

            useEffect(() => { 
                if (phase === 3 || phase === 2 || phase === 1) { 
                    FX.tone(STEPS[phase].note, .3, 'sine', .07); 
                    const t = setTimeout(() => setPhase(phase === 3 ? 2 : phase === 2 ? 1 : 'locked'), 1000); 
                    return () => clearTimeout(t); 
                } 
                if (phase === 'locked') { 
                    // tiny rising chime + sparkle burst — the ritual's "seal"
                    FX.tone(523, .12, 'triangle', .07); FX.tone(659, .12, 'triangle', .07, .1); FX.tone(784, .12, 'triangle', .07, .2); FX.tone(1047, .5, 'triangle', .08, .3); 
                    FX.burst(['✨','⚡','💫','⭐','💖'], 34); 
                    update(s => { if (!s.human.studyTools.t321) s.human.studyTools.t321 = { count: 0, lastAt: 0 }; s.human.studyTools.t321.count += 1; s.human.studyTools.t321.lastAt = Date.now(); }); 
                } 
            }, [phase]); 

            const sparks = useMemo(() => { 
                const EMO = ['✨','💫','⭐','🌸','💖','🫧']; 
                return Array.from({ length: 7 }, () => ({ 
                    e: EMO[Math.floor(Math.random() * EMO.length)], 
                    left: 8 + Math.random() * 84, 
                    delay: Math.random() * .6,
