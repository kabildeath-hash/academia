        function resolveRankedBattle(battle, state, catalog) {
            const h = state.human;
            const aiData = state.ai[battle.opponentId];
            const aiRp = aiData ? aiData.rp : 1000;
            const myRp = h.rp;

            const playerWon = roll <= pWin;

            const transfer = calculateEloTransfer(playerWon ? myRp : aiRp, playerWon ? aiRp : myRp, 40);

            if (playerWon) {
                h.rp = Math.max(0, h.rp + transfer);
                if (aiData) aiData.rp = Math.max(0, aiData.rp - transfer);

                            if (oData) {
                                const wP = 1 / (1 + Math.pow(10, (oData.rp - cur.rp) / 400));
                                const pWon = rng() <= wP;
                                const tr = calculateEloTransfer(pWon ? cur.rp : oData.rp, pWon ? oData.rp : cur.rp, 40);
                                if (pWon) {
                                    cur.rp = Math.max(0, cur.rp + tr);
                                    oData.rp = Math.max(0, oData.rp - tr);
                                } else {
                                    cur.rp = Math.max(0, cur.rp - tr);
                                    oData.rp = Math.max(0, oData.rp + tr);
                                }
                            }
                        }
                    }
                }
            }

            enforceVIPAndChurn(state, catalog);
        }

        function enforceVIPAndChurn(state, catalog) { 
            const rng = mulberry32(Math.floor(Date.now() / 86400000));
            for (const p of catalog) {
                if (p.id === 'human' || p.vip) continue;
                const cur = state.ai[p.id];
                if (!cur) continue;
                if (!cur.retired && cur.xp < 5000 && rng() < 0.0001) {
                    cur.retired = true;
                }
            }

            for (let pass = 0; pass < 2; pass++) { 
                const xpList = catalog.map(p => ({ id: p.id, xp: p.id === 'human' ? state.human.xp : (state.ai[p.id]?.xp ?? 0) })).sort((a,b) => b.xp - a.xp); 
                for (const p of catalog.filter(p=>p.vip)) { 
                    const rank = xpList.findIndex(x => x.id === p.id) + 1; 
                    const limit = p.vipTier === 'A' ? 10 : 50; 
                    if (rank > limit) { 
                        const targetXp = xpList[(p.vipTier === 'A' ? 4 : 24)].xp + 500; 
                        if (state.ai[p.id]) state.ai[p.id].xp = Math.max(state.ai[p.id].xp, targetXp); 
                    } 
                } 
            } 
        } 

        function runTick(state, catalog, force) { 
            const now = Date.now(); 
            const elapsed = now - (state.lastTick || now); 
            state.lastTick = now; 

            // Check active ranked battles for human
            if (state.human.activeRankedBattles) {
                state.human.activeRankedBattles = state.human.activeRankedBattles.map(b => {
                    if (!b.resolved && now >= b.endTime) {
                        return resolveRankedBattle(b, state, catalog);
                    }
                    return b;
                });
            }

            if (elapsed > 0 || force) simulateAIsStep(state, catalog, elapsed); 
            
            const today = todayKey(); 
            if (state.human.dailyStats.date !== today) { 
                state.human.dailyStats = { date: today, tasks: 0, xp: 0, pages: 0, problems: 0, defs: 0, mockTests: 0, rankedBattlesJoined: 0, comboMax: 0 }; 
                state.human.quests.daily = { date: today, progress: {}, claimed: {} }; 
            } 
            const wk = weekKey(); 
            if (state.human.weeklyStats.week !== wk) { 
                state.human.weeklyStats = { week: wk, tasks: 0, xp: 0, mockTests: 0, rankedWins: 0 }; 
                state.human.quests.weekly = { week: wk, progress: {}, claimed: {} }; 
            } 
            
            if (state.human.combo > 0 && state.human.comboExpiry && Date.now() > state.human.comboExpiry) { 
                state.human.combo = 0; state.human.comboProgress = 0; state.human.comboExpiry = 0; 
            } 
            
            if (state.human.lastTaskDay) { 
                const lastDay = new Date(state.human.lastTaskDay + 'T00:00:00'); 
                const todayDate = new Date(today + 'T00:00:00'); 
                const diffDays = Math.floor((todayDate - lastDay) / (24*3600*1000)); 
                if (diffDays > 1) state.human.streak = 0; 
            } 

            const rpList = catalog.map(p => ({ id: p.id, rp: p.id === 'human' ? state.human.rp : (state.ai[p.id]?.rp ?? 1000) })).sort((a,b) => b.rp - a.rp || a.id.localeCompare(b.id)); 
            const humanRankRP = rpList.findIndex(x => x.id === 'human') + 1; 
            const newTier = computeTierForRank(humanRankRP); 
            const tierOrder = { 'LT4':0,'HT4':1,'LT3':2,'HT3':3,'LT2':4,'HT2':5,'LT1':6,'HT1':7 }; 
            
            if (tierOrder[newTier] > tierOrder[state.human.highestTier]) { 
                const oldO = tierOrder[state.human.highestTier]; 
                state.human.highestTier = newTier; 
                for (let o = oldO + 1; o <= tierOrder[newTier]; o++) { 
                    const tn = TIER_ORDER[o], rw = TIER_REWARDS[tn] || {}, inv = state.human.inventory; 
                    inv.eggs += rw.eggs || 0; 
                    for (const pt of rw.potions || []) { 
                        const ex = inv.potions.find(x => x.type === pt); 
                        if (ex) ex.quantity++; 
                        else inv.potions.push({ type: pt, quantity: 1 }); 
                    } 
                    state.human.careerHistory.push({ ts: now, type: 'tier', note: 'Reached ' + tn }); 
                } 
            } 
            return state; 
        } 

        // ============================================================ // ACTIONS // ============================================================ 
        function doCompleteTask(state, catalog, taskType, taskId, baseXp, extraData = {}) { 
            const now = Date.now(); const h = state.human; const today = todayKey(); 
            if (h.lastTaskDay && h.lastTaskDay !== today) { h.combo = 0; h.comboProgress = 0; h.comboExpiry = 0; } 
            if (h.combo > 0 && h.comboExpiry && Date.now() > h.comboExpiry) { h.combo = 0; h.comboProgress = 0; h.comboExpiry = 0; } 
            
            const finalXp = calcTaskXp(baseXp, h, taskType); 
            h.xp += finalXp; h.tasksCompleted += 1; h.dailyStats.tasks += 1; h.dailyStats.xp += finalXp; h.weeklyStats.tasks += 1; h.weeklyStats.xp += finalXp; 
            if (taskType === 'assignment') h.assignmentsCompleted += 1; 
            if (taskId === 'recall_page') { h.recalledPages += 1; h.dailyStats.pages += 1; } 
            if (taskId === 'recall_problem') { h.numericalProblems += 1; h.dailyStats.problems += 1; } 
            if (taskId === 'recall_defs') { h.definitionsRecalled += 5; h.dailyStats.defs += 1; } 
            if (taskType === 'mock') { h.mockTestsCompleted += 1; h.dailyStats.mockTests += 1; h.weeklyStats.mockTests += 1; if (extraData.score) h.mockScoreSum += extraData.score; } 
            
            const potion = potionBonus(h); const comboThreshold = potion.comboDiscount ? 5 : 10; 
            h.comboProgress += 1; 
            if (h.comboProgress >= comboThreshold) { h.combo += 1; h.comboProgress = 0; if (h.combo > h.highestCombo) h.highestCombo = h.combo; if (h.combo > (h.dailyStats.comboMax||0)) h.dailyStats.comboMax = h.combo; } 
            h.comboExpiry = now + 2*3600*1000; 
            
            if (h.dailyStats.tasks === 1) { 
                const yest = new Date(); yest.setDate(yest.getDate()-1); 
                if (h.lastTaskDay === todayKey(yest) || h.streak === 0) { h.streak = h.streak === 0 ? 1 : h.streak + 1; } 
                else { h.streak = Math.max(1, h.streak); } 
                if (h.streak > h.longestStreak) h.longestStreak = h.streak; 
            } 
            h.lastTaskDay = today; 
            
            h.dailyXpLog[today] = (h.dailyXpLog[today] || 0) + finalXp; 
            
            const d = h.quests.daily.progress, w = h.quests.weekly.progress; 
            if (taskType === 'assignment') d.assignments = (d.assignments||0)+1; 
            if (taskId === 'recall_page') d.pages = (d.pages||0)+1; 
            if (taskId === 'recall_problem') d.problems = (d.problems||0)+1; 
            if (taskType === 'mock') { d.mockTests = (d.mockTests||0)+1; w.mockTests = (w.mockTests||0)+1; } 
            d.tasks = (d.tasks||0)+1; w.tasks = (w.tasks||0)+1; w.xp = h.weeklyStats.xp; 
            if (h.combo >= 5) d.comboFive = 1; 
            
            h.careerHistory.push({ ts: now, type: 'task', taskType, taskId, xp: finalXp }); 
            if (h.careerHistory.length > 500) h.careerHistory = h.careerHistory.slice(-500); 
            
            if (h.equippedPet) { 
                const pet = h.inventory.pets.find(p => p.instanceId === h.equippedPet); 
                if (pet) { 
                    pet.petXp += finalXp; 
                    while (pet.petXp >= pet.petXpNeeded && pet.level < 20) { 
                        pet.petXp -= pet.petXpNeeded; pet.level += 1; pet.petXpNeeded = Math.floor(pet.petXpNeeded * 1.4); 
                    } 
                } 
            } 
            
            const newTitleIdx = computeTitleIdx(h.xp); 
            if (newTitleIdx > h.highestTitle) { 
                const titlesGained = []; 
                for (let i = h.highestTitle + 1; i <= newTitleIdx; i++) titlesGained.push(i); 
                h.highestTitle = newTitleIdx; 
                for (const ti of titlesGained) { 
                    h.inventory.eggs += 1; 
                    h.careerHistory.push({ ts: now, type: 'title', title: TITLES[ti] }); 
                } 
            } 
            return finalXp; 
        } 

        function startRankedBattle(state, catalog, settingId) {
            const setting = RANKED_SETTINGS.find(s => s.id === settingId);
            if (!setting) return false;
            const now = Date.now();
            const rng = mulberry32(now + Math.floor(Math.random()*1000));
            const opponentId = findClosestOpponent(state.human.rp, catalog, state.ai, rng);

            const newBattle = {
                id: 'rb_' + now + '_' + Math.floor(Math.random()*1000),
                settingId: setting.id,
                settingName: setting.name,
                durationMs: setting.durationMs,
                startTime: now,
                endTime: now + setting.durationMs,
                opponentId,
                resolved: false
            };

            if (!state.human.activeRankedBattles) state.human.activeRankedBattles = [];
            state.human.activeRankedBattles.push(newBattle);
            state.human.rankedBattlesJoined = (state.human.rankedBattlesJoined || 0) + 1;
            state.human.dailyStats.rankedBattlesJoined = (state.human.dailyStats.rankedBattlesJoined || 0) + 1;
            return true;
        }

        function claimRankedBattle(state, catalog, battleId) {
            if (!state.human.activeRankedBattles) return false;
            const b = state.human.activeRankedBattles.find(x => x.id === battleId);
            if (!b || b.resolved || Date.now() < b.endTime) return false;
            resolveRankedBattle(b, state, catalog);
            return true;
        }

        function hatchEgg(state) { 
            const h = state.human; if (h.inventory.eggs <= 0) return null; 
            h.inventory.eggs -= 1; 
            const titleIdx = computeTitleIdx(h.xp); 
            let eggPool; 
            if (titleIdx >= 40) eggPool = EGGS; 
            else if (titleIdx >= 30) eggPool = EGGS.slice(0, 5); 
            else if (titleIdx >= 20) eggPool = EGGS.slice(0, 4); 
            else if (titleIdx >= 10) eggPool = EGGS.slice(0, 3); 
            else if (titleIdx >= 5) eggPool = EGGS.slice(0, 2); 
            else eggPool = EGGS.slice(0, 1); 
            const egg = pick(Math.random, eggPool); 
            const rng = mulberry32(Math.floor(Math.random()*1e9)); 
            const pet = rollPetFromEgg(egg, rng); 
            const newPet = { instanceId: 'pet_' + Date.now() + '_' + Math.floor(Math.random()*1000), petName: pet.name, eggId: egg.id, emoji: pet.emoji, rarity: pet.rar, ability: pet.ab, val: pet.val, flavor: pet.flavor, level: 1, petXp: 0, petXpNeeded: 100, acquired: Date.now() }; 
            h.inventory.pets.push(newPet); 
            h.careerHistory.push({ ts: Date.now(), type: 'pet', note: `Hatched ${pet.name} (${pet.rar})` }); 
            return newPet; 
        }

        function buildXPLeaderboard(state, catalog) { 
            const rows = catalog.map(p => ({ id: p.id, name: getProfile(p.id, catalog, state).name, username: p.username, nationality: p.nationality, vip: p.vip, vipTier: p.vipTier, xp: p.id === 'human' ? state.human.xp : (state.ai[p.id]?.xp ?? 0) })); 
            rows.sort((a,b) => b.xp - a.xp || a.id.localeCompare(b.id)); 
            rows.forEach((r, i) => { r.rank = i + 1; r.titleIdx = computeTitleIdx(r.xp); r.title = TITLES[r.titleIdx]; }); 
            return rows; 
        }

        function StudyingTab({ state, onComplete, toast }) { const h = state.human; const [active, setActive] = useState(null); const [stage, setStage] = useState(0); const [question, setQuestion] = useState(null); const [answer, setAnswer] = useState(null); const start = (task) => { const rng = mulberry32(Math.floor(Math.random()*1e9)); let content; if (task.id === 'recall_page') { const p = pick(rng, RECALL_PASSAGES); content = { type:'passage', passage: p.passage, q: p.q, opts: p.opts, a: p.a }; } else if (task.id === 'recall_problem') { const p = pick(rng, NUM_PROBLEMS); content = { type:'problem', q: p.q, opts: p.opts, a: p.a }; } else { const defs = shuffle(DEF_SET, rng).slice(0, 5); const target = defs[0]; const wrong = shuffle(DEF_SET.filter(d=>d.term!==target.term), rng).slice(0,3).map(d=>d.term); const opts = shuffle([target.term, ...wrong], rng); content = { type:'defs', defs, q: `Which term matches: "${target.def}"?`, opts, a: opts.indexOf(target.term) }; } setActive(task); setQuestion(content); setStage(0); setAnswer(null); }; const submit = () => setStage(2); const claim = () => { if (!active || !question) return; const correct = answer === question.a; if (correct) { const xp = onComplete('study', active.id, active.xp); toast(`+${xp} XP · ${active.name}`); } else toast('Not quite — try again next time.'); setActive(null); setQuestion(null); setStage(0); setAnswer(null); }; return ( <div className="ac-fade"> <Section title="Studying & Recall" sub="Answer correctly to earn XP"> <div className="ac-grid" style={{ gridTemplateColumns:'repeat(auto-fit, minmax(260px, 1fr))' }}> {STUDY_TASKS.map(t => ( <Card key={t.id}> <div style={{ display:'flex', justifyContent:'space-between', marginBottom: 8 }}> <div style={{ fontSize: 28 }}>{t.icon}</div> <span className="ac-pill" style={{ background: S.pink+'22', color: S.pink }}>{t.xp} XP</span> </div> <div style={{ fontWeight: 700, marginBottom: 4 }}>{t.name}</div> <div style={{ fontSize: 12, color: S.muted, marginBottom: 12 }}>{t.desc}</div> <button className="ac-btn ac-btn-primary" style={{ width: '100%' }} onClick={() => start(t)}>Begin</button> </Card> ))} </div> </Section> {active && question && ( <div className="ac-modal-bg" onClick={() => { if (stage === 0) { setActive(null); setQuestion(null); } }}> <div className="ac-modal" onClick={e => e.stopPropagation()}> <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>{active.name}</div> <div style={{ fontSize: 12, color: S.muted, marginBottom: 16 }}>Reward: +{calcTaskXp(active.xp, h, 'study')} XP (requires correct answer)</div> {stage === 0 && ( <div> {question.type === 'passage' && <div style={{ background: S.bg2, border: `1px solid ${S.border}`, borderRadius: 10, padding: 14, marginBottom: 16, fontSize: 13, lineHeight: 1.6 }}>{question.passage}</div>} {question.type === 'defs' && <div style={{ background: S.bg2, border: `1px solid ${S.border}`, borderRadius: 10, padding: 14, marginBottom: 16, fontSize: 13 }}>{question.defs.map((d, i) => <div key={i} style={{ marginBottom: 4 }}><strong>{d.term}:</strong> {d.def}</div>)}</div>} <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>{question.q}</div> {question.opts.map((opt, i) => ( <button key={i} className="ac-btn" style={{ width:'100%', marginBottom: 6, textAlign:'left', background: answer===i?S.lavender+'22':S.panel2, borderColor: answer===i?S.lavender:S.border }} onClick={() => setAnswer(i)}> {String.fromCharCode(65+i)}. {opt} </button> ))} <div style={{ marginTop: 14 }}><button className="ac-btn ac-btn-primary" style={{ width: '100%' }} disabled={answer === null} onClick={submit}>Submit</button></div> </div> )} {stage === 2 && ( <div> <div style={{ textAlign:'center', padding: 20 }}> <div style={{ fontSize: 40, marginBottom: 8 }}>{answer === question.a ? '✅' : '❌'}</div> <div style={{ fontSize: 16, fontWeight: 700, color: answer === question.a ? S.success : S.danger }}>{answer === question.a ? 'Correct!' : 'Incorrect'}</div> {answer !== question.a &
