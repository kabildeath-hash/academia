        // ============================================================
        // ELO ENGINE

        function computeTitleIdx(xp) { let idx = 0; for (let i = 0; i < TITLE_XP.length; i++) if (xp >= TITLE_XP[i]) idx = i; return idx; }
        function computeTierForRank(rank) { if (rank <= 125) return 'HT1'; if (rank <= 250) return 'LT1'; if (rank <= 375) return 'HT2'; if (rank <= 500) return 'LT2'; if (rank <= 625) return 'HT3'; if (rank <= 750) return 'LT3'; if (rank <= 875) return 'HT4'; return 'LT4'; }
        function comboMultiplier(combo) { if (combo <= 0) return 1; if (combo <= 10) return 1 + combo * 0.05; if (combo <= 25) return 1.5 + (combo - 10) * 0.08; if (combo <= 50) return 2.7 + (combo - 25) * 0.12; if (combo <= 100) return 5.7 + (combo - 50) * 0.22; return 16.7 * Math.pow(1.02, combo - 100); }
        function rollPetFromEgg(egg, rng) { const roll = rng(); let cum = 0, chosenRarity = 'Common'; for (const [r, w] of RARITY_WEIGHTS) { cum += w; if (roll <= cum) { chosenRarity = r; break; } } const candidates = egg.pets.filter(p => p.rar === chosenRarity); return pick(rng, candidates.length ? candidates : egg.pets); }
        function petBonus(human) { if (!human.equippedPet) return { ab:null, val:0, def:null }; const pet = human.inventory.pets.find(p => p.instanceId === human.equippedPet); if (!pet) return { ab:null, val:0, def:null }; const def = EGGS.flatMap(e => e.pets).find(p => p.name === pet.petName); if (!def) return { ab:null, val:0, def:null }; const levelMul = 1 + 0.05 * (pet.level - 1); return { ab: def.ab, val: def.val * levelMul, def }; }
        function potionBonus(human) { if (!human.activePotion) return { mult:1, comboDiscount:false }; const p = human.activePotion; if (Date.now() > p.expires) return { mult:1, comboDiscount:false }; if (p.type === 'double_xp') return { mult:2, comboDiscount:false }; if (p.type === 'golden_study') return { mult:1.5, comboDiscount:false }; if (p.type === 'combo_craze') return { mult:1, comboDiscount:true }; return { mult:1, comboDiscount:false }; }
        function calcTaskXp(baseXp, human, taskType) {
            const comboMult = comboMultiplier(human.combo);
            const pb = petBonus(human);
            let petBonusVal = 0;
            if (pb.def) {
                if (pb.def.ab === 'xp_all') petBonusVal = pb.val;
                else if (pb.def.ab === 'xp_assign' && taskType === 'assignment') petBonusVal = pb.val;
                else if (pb.def.ab === 'xp_study' && taskType === 'study') petBonusVal = pb.val;
                else if (pb.def.ab === 'xp_recall' && taskType === 'study') petBonusVal = pb.val;
                else if (pb.def.ab === 'xp_mock' && taskType === 'mock') petBonusVal = pb.val;
            }
            const pBonus = potionBonus(human);
            return Math.max(1, Math.floor(baseXp * comboMult * (1 + petBonusVal) * pBonus.mult));
        }

        function calcEloTransfer(winnerRp, loserRp, repeatCount = 0) {
            const K = 40;
            const P = 1 / (1 + Math.pow(10, (loserRp - winnerRp) / 400));
            const farmPenalty = 1 / (1 + repeatCount * 0.5);
            return Math.max(1, Math.round(K * (1 - P) * farmPenalty));
        }

        function findClosestOpponent(humanRp, state, catalog, category) {
            const candidates = catalog.filter(p => p.id !== 'human' && !state.ai[p.id]?.retired);
            candidates.sort((a, b) => {
                const dA = Math.abs((state.ai[a.id]?.rp[category] || 0) - humanRp);
                const dB = Math.abs((state.ai[b.id]?.rp[category] || 0) - humanRp);
                return dA - dB;
            });
            const topPool = candidates.slice(0, 15);
            return pick(Math.random, topPool);
        }

        function resolveRankedMatch(state, catalog, category) {
            const h = state.human;
            const m = h.activeMatches?.[category];
            if (!m) return null;

            const oppId = m.opponentId;
            const oppState = state.ai[oppId];
            const oppRp = oppState?.rp[category] ?? STARTING_RP;
            const humanRp = h.rp[category] ?? STARTING_RP;

            const myXp = Math.floor(m.humanXp || 0);
            const oppXp = Math.floor(m.targetOppXp);

            let outcome = 'draw';
            let transfer = 0;
            const histKey = category + ':' + oppId;
            const repeats = h.opponentHistory[histKey] || 0;

            if (myXp > oppXp) {
                outcome = 'win';
                const raw = calcEloTransfer(humanRp, oppRp, repeats);
                h.rp[category] = humanRp + raw;
                if (oppState) oppState.rp[category] = Math.max(0, oppRp - raw);
                h.rankedWins[category] = (h.rankedWins[category] || 0) + 1;
                h.weeklyStats.rankedWins = (h.weeklyStats.rankedWins || 0) + 1;
                h.opponentHistory[histKey] = repeats + 1;
                transfer = raw;
            } else if (oppXp > myXp) {
                outcome = 'loss';
                const raw = calcEloTransfer(oppRp, humanRp, 0);
                const actualLoss = Math.min(raw, humanRp);
                h.rp[category] = Math.max(0, humanRp - actualLoss);
                if (oppState) oppState.rp[category] = oppRp + actualLoss;
                h.rankedLosses[category] = (h.rankedLosses[category] || 0) + 1;
                transfer = -actualLoss;
            } else {
                h.rankedDraws[category] = (h.rankedDraws[category] || 0) + 1;
            }

            h.activeMatches[category] = null;

            const oppProf = getProfile(oppId, catalog, state);
            const record = {
                ts: Date.now(), category,
                mode: m.modeName, hours: m.hours,
                oppId, oppName: oppProf.name,
                myXp, oppXp, outcome, rpDelta: transfer
            };
            state.recentMatches.unshift(record);
            if (state.recentMatches.length > 50) state.recentMatches.pop();

            h.careerHistory.push({
                ts: Date.now(),
                type: outcome === 'win' ? 'ranked_win' : 'ranked_match',
                note: `${CAT_META[category].label} ${m.modeName} vs ${oppProf.name} (${outcome.toUpperCase()})`,
                rp: transfer
            });
            return record;
        }

        // ============================================================
        // AI SIMULATION
        // ============================================================
        function getActivityMultiplier(hour, weekday, peakHour) {
            const dist = Math.abs(hour - peakHour);
            const circadian = Math.max(0.1, 1 - Math.min(dist, 24 - dist) / 12);
            const weekendDip = (weekday === 0 || weekday === 6) ? 0.8 : 1.0;
            return circadian * weekendDip;
        }

        function isInWindow(h, start, len) {
            const end = (start + len) % 24;
            return start < end ? (h >= start && h < end) : (h >= start || h < end);
        }

        function simulateAIsStep(state, catalog, elapsedMs) {
            const now = Date.now();
            const totalHours = Math.min(168, Math.max(0, elapsedMs / 3600000));
            if (totalHours <= 0) { enforceVIPAndChurn(state, catalog); return; }

            const steps = Math.max(1, Math.min(168, Math.floor(totalHours)));
            const stepHours = totalHours / steps;
            const humanRp = state.human.rp;

            for (let s = 0; s < steps; s++) {
                const simDate = new Date(now - (steps - s) * stepHours * 3600000);
                const hour = simDate.getHours();
                const weekday = simDate.getDay();
                const bucket = Math.floor(simDate.getTime() / 3600000);

                // XP grinding
                for (const p of catalog) {
                    if (p.id === 'human') continue;
                    const cur = state.ai[p.id];
                    if (!cur || cur.retired) continue;
                    if (simDate.getTime() < cur.offUntil) continue;

                    const pr = p.aiProfile;
                    const rng = mulberry32(hashStr(p.id + '_' + bucket));

                    // Sleep window (8 hours roughly opposite peak hour)
                    const sleepStart = (pr.peakHour + 12) % 24;
                    if (isInWindow(hour, sleepStart, 8)) {
                        cur.energy = clamp(cur.energy + 0.03, 0.5, 1.8);
                        continue;
                    }

                    // Session blocks: 4h blocks, 25% chance of a rest block
                    const sessRng = mulberry32(hashStr(p.id + '_sess_' + Math.floor(bucket / 4)));
                    if (sessRng() < 0.25) {
                        cur.energy = clamp(cur.energy + 0.03, 0.5, 1.8);
                        continue;
                    }

                    cur.energy = clamp(cur.energy + (rng() - 0.55) * 0.10, 0.4, 1.8);

                    // Rare multi-day burnout
                    if (rng() < 0.005) {
                        cur.offUntil = simDate.getTime() + randInt(rng, 12, 48) * 3600000;
                        continue;
                    }

                    // Rival-aware pressure
                    let adaptive = 1.0;
                    const foc = cur.focusCategory;
                    if (foc && humanRp) {
                        const rpDiff = (cur.rp[foc] || 0) - (humanRp[foc] || 0);
                        if (Math.abs(rpDiff) < 80) adaptive = 1.25;
                        else if (rpDiff < -300) adaptive = 0.80;
                        else if (rpDiff > 500) adaptive = 0.85;
                    }

                    cur.mood = clamp(cur.mood + (rng() - 0.5) * 0.15, 0.6, 1.4);

                    const actMul = getActivityMultiplier(hour, weekday, pr.peakHour || 14);
                    const varMul = Math.max(0.05, 1 + (rng() - 0.5) * pr.variability * 2);
                    const gain = pr.dailyXpAvg * (stepHours / 24) * actMul * varMul * cur.energy * adaptive * cur.mood;

                    if (gain > 0) {
                        cur.xp += gain;
                        const w = cur.catWeights;
                        cur.xpByCat.assignments += gain * w.assignments;
                        cur.xpByCat.studying    += gain * w.studying;
                        cur.xpByCat.other       += gain * w.other;
                    }
                }

                // AI vs AI duels, per category, time-scaled
                const duelRng = mulberry32(bucket + 999);
                const activeAIs = catalog.filter(p => p.id !== 'human' && !state.ai[p.id]?.retired);
                const expectedDuels = stepHours * 25;
                const duelsPerCat = Math.floor(expectedDuels) + (Math.random() < (expectedDuels % 1) ? 1 : 0);

                if (duelsPerCat > 0 && activeAIs.length > 2) {
                    for (const cat of CATEGORIES) {
                        const pool = [...activeAIs].sort((a, b) =>
                            (state.ai[b.id]?.rp[cat] || 0) - (state.ai[a.id]?.rp[cat] || 0));

                        for (let d = 0; d < duelsPerCat; d++) {
                            const i1 = randInt(duelRng, 0, pool.length - 2);
                            const i2 = Math.min(pool.length - 1, i1 + randInt(duelRng, 1, 10));
                            const p1 = pool[i1], p2 = pool[i2];
                            const s1 = state.ai[p1.id], s2 = state.ai[p2.id];
                            if (!s1 || !s2) continue;

                            const catRate = p => p.aiProfile.dailyXpAvg *
                                (p.aiProfile.focusCategory === cat ? 1.35 : 0.75);
                            const score1 = catRate(p1) * s1.energy * s1.mood * rand(duelRng, 0.5, 1.5);
                            const score2 = catRate(p2) * s2.energy * s2.mood * rand(duelRng, 0.5, 1.5);

                            const r1 = s1.rp[cat] || 0, r2 = s2.rp[cat] || 0;

                            if (score1 > score2) {
                                const tr = Math.max(1, calcEloTransfer(r1, r2, 0));
                                s1.rp[cat] = r1 + tr;
                                s2.rp[cat] = Math.max(0, r2 - tr);
                            } else if (score2 > score1) {
                                const tr = Math.max(1, calcEloTransfer(r2, r1, 0));
                                s2.rp[cat] = r2 + tr;
                                s1.rp[cat] = Math.max(0, r1 - tr);
                            }
                        }
                    }
                }
            }

            enforceVIPAndChurn(state, catalog);
        }

        function enforceVIPAndChurn(state, catalog) {
            // VIPs stay inside their expected rank brackets
            for (let pass = 0; pass < 2; pass++) {
                const xpList = catalog.map(p => ({ id: p.id, xp: p.id === 'human' ? state.human.xp : (state.ai[p.id]?.xp ?? 0) })).sort((a,b) => b.xp - a.xp);
                for (const p of catalog.filter(p=>p.vip)) {
                    const rank = xpList.findIndex(x => x.id === p.id) + 1;
                    const limit = p.vipTier === 'A' ? 10 : 50;
                    if (rank > limit) {
                        const targetXp = xpList[(p.vipTier === 'A' ? 4 : 24)].xp + 500;
                        if (state.ai[p.id]) state.ai[p.id].xp = Math.max(state.ai[p.id].xp, targetXp);
                    }
                }
            }
        }

        function runTick(state, catalog, force) {
            const now = Date.now();
            const elapsed = now - (state.lastTick || now);
            state.lastTick = now;

            // Resolve ended matches
            for (const cat of CATEGORIES) {
                if (state.human.activeMatches?.[cat] && now >= state.human.activeMatches[cat].end) {
                    resolveRankedMatch(state, catalog, cat);
                }
            }

            if (elapsed > 0 || force) simulateAIsStep(state, catalog, elapsed);

            // Roll daily / weekly
            const today = todayKey();
            if (state.human.dailyStats.date !== today) {
                state.human.dailyStats = { date: today, tasks: 0, xp: 0, pages: 0, problems: 0, defs: 0, mockTests: 0, rankedMatches: 0, comboMax: 0 };
                state.human.quests.daily = { date: today, progress: {}, claimed: {} };
            }
            const wk = weekKey();
            if (state.human.weeklyStats.week !== wk) {
                state.human.weeklyStats = { week: wk, tasks: 0, xp: 0, mockTests: 0, rankedWins: 0 };
                state.human.quests.weekly = { week: wk, progress: {}, claimed: {} };
            }

            // Combo decay
            if (state.human.combo > 0 && state.human.comboExpiry && Date.now() > state.human.comboExpiry) {
                state.human.combo = 0; state.human.comboProgress = 0; state.human.comboExpiry = 0;
            }

            // Streak break
            if (state.human.lastTaskDay) {
                const lastDay = new Date(state.human.lastTaskDay + 'T00:00:00');
                const todayDate = new Date(today + 'T00:00:00');
                const diffDays = Math.floor((todayDate - lastDay) / 86400000);
                if (diffDays > 1) state.human.streak = 0;
            }

            // Expire potion
            if (state.human.activePotion && Date.now() > state.human.activePotion.expires) {
                state.human.activePotion = null;
            }

            // Tier from best category rank
            const bestRank = Math.min(...CATEGORIES.map(cat => {
                const list = catalog.map(p => ({
                    id: p.id,
                    rp: p.id === 'human' ? (state.human.rp[cat] || 0) : (state.ai[p.id]?.rp[cat] ?? 0)
                })).sort((a, b) => b.rp - a.rp);
                return list.findIndex(x => x.id === 'human') + 1;
            }));

            const newTier = computeTierForRank(bestRank);
            const tierOrder = { 'LT4': 0, 'HT4': 1, 'LT3': 2, 'HT3': 3, 'LT2': 4, 'HT2': 5, 'LT1': 6, 'HT1': 7 };

            if (tierOrder[newTier] > tierOrder[state.human.highestTier]) {
                const oldO = tierOrder[state.human.highestTier];
                state.human.highestTier = newTier;
                for (let o = oldO + 1; o <= tierOrder[newTier]; o++) {
                    const tn = TIER_ORDER[o], rw = TIER_REWARDS[tn] || {}, inv = state.human.inventory;
                    inv.eggs += rw.eggs || 0;
                    for (const pt of rw.potions || []) {
                        const ex = inv.potions.find(x => x.type === pt);
                        if (ex) ex.quantity++; else inv.potions.push({ type: pt, quantity: 1 });
                    }
                    state.human.careerHistory.push({ ts: now, type: 'tier', note: 'Reached ' + tn });
                }
            }
            return state;
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function doCompleteTask(state, catalog, taskType, taskId, baseXp, extraData = {}) {
            const now = Date.now(); const h = state.human; const today = todayKey();
            if (h.lastTaskDay && h.lastTaskDay !== today) { h.combo = 0; h.comboProgress = 0; h.comboExpiry = 0; }
            if (h.combo > 0 && h.comboExpiry && Date.now() > h.comboExpiry) { h.combo = 0; h.comboProgress = 0; h.comboExpiry = 0; }

            const finalXp = calcTaskXp(baseXp, h, taskType);
            h.xp += finalXp; h.tasksCompleted += 1; h.dailyStats.tasks += 1; h.dailyStats.xp += finalXp; h.weeklyStats.tasks += 1; h.weeklyStats.xp += finalXp;
            if (taskType === 'assignment') h.assignmentsCompleted += 1;
            if (taskId === 'recall_page') { h.recalledPages += 1; h.dailyStats.pages += 1; }
            if (taskId === 'recall_problem') { h.numericalProblems += 1; h.dailyStats.problems += 1; }
            if (taskId === 'recall_defs') { h.definitionsRecalled += 5; h.dailyStats.defs += 1; }
            if (taskType === 'mock') { h.mockTestsCompleted += 1; h.dailyStats.mockTests += 1; h.weeklyStats.mockTests += 1; if (extraData.score) h.mockScoreSum += extraData.score; }

            const potion = potionBonus(h); const comboThreshold = potion.comboDiscount ? 5 : 10;
            h.comboProgress += 1;
            if (h.comboProgress >= comboThreshold) { h.combo += 1; h.comboProgress = 0; if (h.combo > h.highestCombo) h.highestCombo = h.combo; if (h.combo > (h.dailyStats.comboMax||0)) h.dailyStats.comboMax = h.combo; }
            h.comboExpiry = now + 2*3600*1000;

            if (h.dailyStats.tasks === 1) {
                const yest = new Date(); yest.setDate(yest.getDate()-1);
                if (h.lastTaskDay === todayKey(yest) || h.streak === 0) { h.streak = h.streak === 0 ? 1 : h.streak + 1; }
                else { h.streak = Math.max(1, h.streak); }
                if (h.streak > h.longestStreak) h.longestStreak = h.streak;
            }
            h.lastTaskDay = today;

            // Feed live ranked match (category gated)
            const rankedCat = TASK_CAT[taskType];
            if (rankedCat && h.activeMatches?.[rankedCat] && now < h.activeMatches[rankedCat].end) {
                h.activeMatches[rankedCat].humanXp = (h.activeMatches[rankedCat].humanXp || 0) + finalXp;
            }

            h.dailyXpLog[today] = (h.dailyXpLog[today] || 0) + finalXp;

            const d = h.quests.daily.progress, w = h.quests.weekly.progress;
            if (taskType === 'assignment') d.assignments = (d.assignments||0)+1;
            if (taskId === 'recall_page') d.pages = (d.pages||0)+1;
            if (taskId === 'recall_problem') d.problems = (d.problems||0)+1;
            if (taskType === 'mock') { d.mockTests = (d.mockTests||0)+1; w.mockTests = (w.mockTests||0)+1; }
            d.tasks = (d.tasks||0)+1; w.tasks = (w.tasks||0)+1; w.xp = h.weeklyStats.xp;
            if (h.combo >= 5) d.comboFive = 1;

            h.careerHistory.push({ ts: now, type: 'task', taskType, taskId, xp: finalXp });
            if (h.careerHistory.length > 500) h.careerHistory = h.careerHistory.slice(-500);

            if (h.equippedPet) {
                const pet = h.inventory.pets.find(p => p.instanceId === h.equippedPet);
                if (pet) {
                    pet.petXp += finalXp;
                    while (pet.petXp >= pet.petXpNeeded && pet.level < 20) {
                        pet.petXp -= pet.petXpNeeded; pet.level += 1; pet.petXpNeeded = Math.floor(pet.petXpNeeded * 1.4);
                    }
                }
            }

            const newTitleIdx = computeTitleIdx(h.xp);
            if (newTitleIdx > h.highestTitle) {
                const titlesGained = [];
                for (let i = h.highestTitle + 1; i <= newTitleIdx; i++) titlesGained.push(i);
                h.highestTitle = newTitleIdx;
                for (const ti of titlesGained) {
                    h.inventory.eggs += 1;
                    h.careerHistory.push({ ts: now, type: 'title', title: TITLES[ti] });
                }
            }
            return finalXp;
        }

        function startRankedBattle(state, catalog, mode, category) {
            const h = state.human;
            if (!h.activeMatches) h.activeMatches = { assignments: null, studying: null, other: null };
            if (h.activeMatches[category]) return false;

            const humanRp = h.rp[category] ?? STARTING_RP;
            const opp = findClosestOpponent(humanRp, state, catalog, category);
            if (!opp) return false;

            const oppState = state.ai[opp.id];
            const oppDaily = opp.aiProfile.dailyXpAvg || 100;
            const energy = oppState?.energy ?? 1.0;
            const mood = oppState?.mood ?? 1.0;
            const focusMul = opp.aiProfile.focusCategory === category ? 1.35 : 0.75;
            const targetOppXp = Math.max(
                15,
                Math.floor(oppDaily * (mode.hours / 24) * 2.2 * energy * mood * focusMul * rand(Math.random, 0.75, 1.35))
            );

            const now = Date.now();
            h.activeMatches[category] = {
                id: 'rm_' + category + '_' + now,
                category,
                modeId: mode.id, modeName: mode.name, hours: mode.hours,
                start: now, end: now + mode.hours * 3600000,
                opponentId: opp.id, humanXp: 0, targetOppXp
            };
            h.dailyStats.rankedMatches = (h.dailyStats.rankedMatches || 0) + 1;
            return true;
        }

        function hatchEgg(state) {
            const h = state.human; if (h.inventory.eggs <= 0) return null;
            h.inventory.eggs -= 1;
            const titleIdx = computeTitleIdx(h.xp);
            let eggPool;
            if (titleIdx >= 40) eggPool = EGGS;
            else if (titleIdx >= 30) eggPool = EGGS.slice(0, 5);
            else if (titleIdx >= 20) eggPool = EGGS.slice(0, 4);
            else if (titleIdx >= 10) eggPool = EGGS.slice(0, 3);
            else if (titleIdx >= 5) eggPool = EGGS.slice(0, 2);
            else eggPool = EGGS.slice(0, 1);
            const egg = pick(Math.random, eggPool);
            const rng = mulberry32(Math.floor(Math.random()*1e9));
            const pet = rollPetFromEgg(egg, rng);
            const newPet = { instanceId: 'pet_' + Date.now() + '_' + Math.floor(Math.random()*1000), petName: pet.name, eggId: egg.id, emoji: pet.emoji, rarity: pet.rar, ability: pet.ab, val: pet.val, flavor: pet.flavor, level: 1, petXp: 0, petXpNeeded: 100, acquired: Date.now() };
            h.inventory.pets.push(newPet);
            h.careerHistory.push({ ts: Date.now(), type: 'pet', note: `Hatched ${pet.name} (${pet.rar})` });
            return newPet;
        }

        // ============================================================
        // LEADERBOARDS
        // ============================================================
        function buildXPLeaderboard(state, catalog) {
            const rows = catalog.map(p => ({
                id: p.id,
                name: getProfile(p.id, catalog, state).name,
                username: p.username,
                nationality: p.nationality,
                vip: p.vip, vipTier: p.vipTier,
                xp: p.id === 'human' ? state.human.xp : (state.ai[p.id]?.xp ?? 0)
            }));
            rows.sort((a,b) => b.xp - a.xp || a.id.localeCompare(b.id));
            rows.forEach((r, i) => { r.rank = i + 1; r.titleIdx = computeTitleIdx(r.xp); r.title = TITLES[r.titleIdx]; });
            return rows;
        }
        function buildRPLeaderboard(state, catalog, category) {
            const rows = catalog.map(p => ({
                id: p.id,
                name: getProfile(p.id, catalog, state).name,
                username: p.username,
                nationality: p.nationality,
                vip: p.vip, vipTier: p.vipTier,
                rp: p.id === 'human' ? (state.human.rp[category] || 0) : (state.ai[p.id]?.rp[category] ?? 0)
            }));
            rows.sort((a, b) => b.rp - a.rp || a.id.localeCompare(b.id));
            rows.forEach((r, i) => { r.rank = i + 1; r.tier = computeTierForRank(r.rank); });
            return rows;
        }
