            if (phase === 'idle') return ( 
                <Card style={{ textAlign:'center', padding: '46px 20px', position:'relative', overflow:'hidden', color: INK, background: 'linear-gradient(165deg,#ece4ff 0%,#ffe0ef 55%,#d9eafc 100%)', border: `1.5px solid ${INK}2e` }}> 
                    {['✨','🌙','💫','⭐'].map((e, i) => ( 
                        <span key={i} className="ac-float" style={{ position:'absolute', left: (8 + i * 26) + '%', top: (i % 2 ? 12 : 62) + '%', fontSize: 16 + (i % 3) * 5, opacity: .45, pointerEvents:'none', animationDelay: (i * .5) + 's' }}>{e}</span> 
                    ))} 
                    <div className="st-wiggle" style={{ fontSize: 40, marginBottom: 8 }}>🧸</div> 
                    <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>The 3 · 2 · 1 Ritual</div> 
                    <div style={{ fontSize: 13.5, color: INK_SOFT, maxWidth: 400, margin: '0 auto 20px', lineHeight: 1.65 }}> 
                        When it's time to study, tap the button and count down with it — three numbers, that's the whole ritual. 
                        Do it every time, and soon just <em>thinking</em> "3, 2, 1" will flip your brain into study mode. 
                    </div> 
                    <div style={{ display:'flex', gap: 10, justifyContent:'center', margin: '0 0 24px' }}> 
                        {[3, 2, 1].map((n, i) => ( 
                            <span key={n} className="ac-float" style={{ width: 44, height: 44, borderRadius: 14, display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize: 20, fontWeight: 800, color: INK, background: 'rgba(255,255,255,.75)', border: `1.5px solid ${STEPS[n].deep}55`, boxShadow: '0 3px 8px rgba(8,8,12,.1)', animationDelay: (i * .35) + 's' }}>{n}</span> 
                        ))} 
                    </div> 
                    <button onClick={begin} className="st-btn" style={{ '--g': '#f5b3d3', width: 150, height: 150, borderRadius: '50%', cursor:'pointer', background: '#ffffff', color: INK, fontSize: 20, fontWeight: 800, border: `2.5px solid ${INK}`, outline:'none', boxShadow: `0 6px 0 ${INK}`, display:'inline-flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap: 2, fontFamily:'inherit' }}> 
                        <span style={{ fontSize: 34, lineHeight: 1 }}>✨</span> 
                        3 · 2 · 1 
                    </button> 
                    <div style={{ marginTop: 24, fontSize: 12, color: INK_SOFT }}> 
                        {T.count > 0 
                            ? <>You've locked in <strong style={{ color: INK }}>{T.count}×</strong> — the ritual is working 🎐</> 
                            : 'First time? Perfect. Begin the ritual ✨'} 
                    </div> 
                </Card> 
            ); 

            if (phase === 'locked') return ( 
                <Card style={{ textAlign:'center', padding: '46px 20px', position:'relative', overflow:'hidden', color: INK, background: 'linear-gradient(165deg,#d8f6e8 0%,#ece4ff 55%,#ffe0ef 100%)', border: `1.5px solid ${INK}2e` }}> 
                    <div className="st-lock"> 
                        <div className="st-beat" style={{ fontSize: 56, marginBottom: 10 }}>⚡</div> 
                        <div style={{ fontSize: 'clamp(30px, 7vw, 44px)', fontWeight: 900, letterSpacing: 1, display:'inline-block', color: INK, textShadow: '0 0 22px rgba(255,255,255,.9)' }}>LOCKED IN</div> 
                    </div> 
                    <div style={{ fontSize: 14.5, color: INK_SOFT, margin: '16px auto 6px', maxWidth: 400, lineHeight: 1.65 }}> 
                        Ritual complete — you just told your brain it's study time. No more scrolling, no more "in a minute". Open your books and begin. 
                    </div> 
                    <div style={{ fontSize: 12, color: INK_SOFT, margin: '6px 0 24px' }}>Rituals performed: <strong style={{ color: INK }}>{T.count}</strong> 🎐</div> 
                    <div style={{ display:'flex', gap: 10, justifyContent:'center', flexWrap:'wrap' }}> 
                        <button className="ac-btn" style={PILL} onClick={begin}>🔁 Again</button> 
                        {onNav && <button className="ac-btn ac-btn-primary" style={{ border: `1.5px solid ${INK}`, boxShadow: `0 3px 0 ${INK}` }} onClick={() => { FX.play('click'); onNav('studying'); }}>📚 Study now</button>} 
                        <button className="ac-btn" style={PILL} onClick={() => setPhase('idle')}>🏠 Done</button> 
                    </div> 
                </Card> 
            ); 

            const step = STEPS[phase]; 
            return ( 
                <Card style={{ textAlign:'center', padding: '34px 20px 22px', position:'relative', overflow:'hidden', color: INK, background: step.bg, border: `1.5px solid ${INK}2e` }}> 
                    {sparks.map((sp, i) => ( 
                        <span key={i} className="st-spark" style={{ left: sp.left + '%', fontSize: sp.size, animationDelay: sp.delay + 's' }}>{sp.e}</span> 
                    ))} 
                    <div style={{ height: 290, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}> 
                        <div style={{ position:'relative', width: 208, height: 208, display:'flex', alignItems:'center', justifyContent:'center' }}> 
                            <div className="st-ring" style={{ '--g': step.deep }} /> 
                            <div className="st-ring" style={{ '--g': step.deep, animationDelay: '.32s' }} /> 
                            <div className="st-num" key={phase} style={{ '--g': step.deep + '99', fontSize: 126, fontWeight: 800, color: INK, lineHeight: 1 }}>{phase}</div> 
                        </div> 
                        <div style={{ marginTop: 22, fontSize: 15, fontWeight: 700, color: INK }}>{step.emoji} {step.word}</div> 
                        <div style={{ marginTop: 12, display:'flex', gap: 8 }}> 
                            {[3, 2, 1].map(n => ( 
                                <span key={n} style={{ width: 10, height: 10, borderRadius: '50%', background: n === phase ? STEPS[n].deep : INK + '26', boxShadow: n === phase ? `0 0 10px ${STEPS[n].deep}` : 'none', transition: 'all .2s' }} /> 
                            ))} 
                        </div> 
                    </div> 
                    <button className="ac-btn" style={{ ...PILL, fontSize: 12, padding: '6px 14px' }} onClick={() => setPhase('idle')}>✕ cancel</button> 
                </Card> 
            ); 
        } 

        // --- ST: Timer & stopwatch ---
        function ToolTimer({ st, update, toast }) { 
            const T = st.timers || { saved: [], active: null, sw: { base: 0, startedAt: null } }; 
            const [h, setH] = useState(0); const [m, setM] = useState(25); const [s, setS] = useState(0); 
            const [name, setName] = useState(''); 
            const [, setTick] = useState(0); 
            useEffect(() => { const i = setInterval(() => setTick(t => t + 1), 250); return () => clearInterval(i); }, []); 
            const total = h * 3600 + m * 60 + s; 
            const start = (sec, label) => { 
                if (!sec || sec <= 0) { toast('⏱️ Pick a duration first'); return; } 
                FX.play('click'); 
                update(st2 => { ensureTimers(st2).active = { label: label || 'Timer', sec, endAt: Date.now() + sec * 1000, done: false }; }); 
                toast(`▶️ ${label || 'Timer'} started · ${fmtClock(sec)} — countdown shows in the corner of every tab`); 
            }; 
            const pauseToggle = () => update(st2 => { 
                const a = ensureTimers(st2).active; if (!a || a.done) return; 
                if (a.endAt) { a.remaining = Math.max(0, a.endAt - Date.now()); a.endAt = null; } 
                else if (a.remaining) { a.endAt = Date.now() + a.remaining; a.remaining = 0; } 
            }); 
            const cancel = () => update(st2 => { ensureTimers(st2).active = null; }); 
            const savePreset = () => { 
                if (total <= 0) { toast('⏱️ Set a duration first'); return; } 
                update(st2 => { ensureTimers(st2).saved.push({ id: uid(), label: (name.trim() || fmtClock(total)).slice(0, 24), sec: total }); }); 
                setName(''); toast('💾 Timer preset saved'); 
            }; 
            const sw = T.sw || { base: 0, startedAt: null }; 
            const swMs = sw.base + (sw.startedAt ? Date.now() - sw.startedAt : 0); 
            const swToggle = () => { FX.play('click'); update(st2 => { const w = ensureTimers(st2).sw; if (w.startedAt) { w.base += Date.now() - w.startedAt; w.startedAt = null; } else w.startedAt = Date.now(); }); }; 
            const swReset = () => update(st2 => { ensureTimers(st2).sw = { base: 0, startedAt: null }; }); 
            const a = T.active; 
            const aRem = a ? (a.endAt ? (a.endAt - Date.now()) / 1000 : (a.remaining || 0) / 1000) : 0; 
            const numInput = (val, set, max, unit) => ( 
                <label key={unit} style={{ fontSize: 12, color: S.muted, display:'flex', alignItems:'center', gap: 4 }}> 
                    <input type="number" min="0" max={max} value={val} onChange={e => set(clamp(parseInt(e.target.value) || 0, 0, max))} style={{ width: 58, background: S.bg2, color: S.text, border: `1px solid ${S.border}`, borderRadius: 8, padding: '8px 6px', fontSize: 16, fontWeight: 700, textAlign:'center', fontFamily:'inherit' }} /> {unit} 
                </label> 
            ); 
            return ( 
                <div className="ac-fade"> 
                    <Card style={{ textAlign:'center', padding: '26px 20px', marginBottom: 14 }}> 
                        <div style={{ fontSize: 13, color: S.muted, marginBottom: 8, letterSpacing: 2, fontWeight: 700 }}>⏱️ COUNTDOWN TIMER</div> 
                        {a ? ( 
                            <div className="ac-fade"> 
                                <div style={{ fontSize: 'clamp(46px, 12vw, 76px)', fontWeight: 900, color: a.done ? S.mint : S.lavender, lineHeight: 1.1 }}>{a.done ? '⏰' : fmtClock(aRem)}</div> 
                                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14 }}>{a.label}{a.done ? ' — finished!' : (a.endAt ? '' : ' · paused')}</div> 
                                <div style={{ display:'flex', gap: 10, justifyContent:'center', flexWrap:'wrap' }}> 
                                    {!a.done && <button className="ac-btn" onClick={pauseToggle}>{a.endAt ? '⏸ Pause' : '▶️ Resume'}</button>} 
                                    <button className="ac-btn ac-btn-primary" onClick={() => start(a.sec, a.label)}>🔁 Restart</button> 
                                    <button className="ac-btn" onClick={cancel}>{a.done ? '✕ Dismiss' : '✕ Cancel'}</button> 
                                </div> 
                                <div style={{ fontSize: 11, color: S.muted, marginTop: 10 }}>While it runs, the countdown stays pinned in the corner of every tab.</div> 
                            </div> 
                        ) : ( 
                            <div> 
                                <div style={{ display:'flex', gap: 8, justifyContent:'center', marginBottom: 16, flexWrap:'wrap' }}> 
                                    {[[5,'5m'],[10,'10m'],[15,'15m'],[25,'25m'],[45,'45m'],[90,'90m']].map(([sec, lab]) => ( 
                                        <button key={lab} className="ac-btn" onClick={() => start(sec * 60, lab === '25m' ? 'Pomodoro' : lab + ' timer')}>{lab}</button> 
                                    ))} 
                                </div> 
                                <div style={{ display:'flex', gap: 8, justifyContent:'center', alignItems:'center', flexWrap:'wrap', marginBottom: 14 }}> 
                                    {[['h', h, setH, 23], ['m', m, setM, 59], ['s', s, setS, 59]].map(([unit, val, set, max]) => numInput(val, set, max, unit))} 
                                </div> 
                                <div style={{ display:'flex', gap: 8, justifyContent:'center', flexWrap:'wrap' }}> 
                                    <input value={name} onChange={e => setName(e.target.value)} placeholder="name (optional)" maxLength={24} style={{ background: S.bg2, color: S.text, border: `1px solid ${S.border}`, borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily:'inherit', width: 150 }} /> 
                                    <button className="ac-btn ac-btn-primary" onClick={() => start(total, name.trim() || undefined)}>▶️ Start</button> 
                                    <button className="ac-btn" onClick={savePreset}>💾 Save preset</button> 
                                </div> 
                            </div> 
                        )} 
                    </Card> 
                    <Card style={{ marginBottom: 14 }}>

        // --- ST: floating timer/stopwatch widget, pinned to the corner on every tab ---
        function TimerWidget({ state, update, toast, onNav }) { 
            const tm = state.human.studyTools && state.human.studyTools.timers; 
            const a = tm && tm.active, sw = tm && tm.sw; 
            const swRun = sw && sw.startedAt; 
            const [, setTick] = useState(0); 
            const fired = useRef(0); 
            useEffect(() => { 
                if (!a && !swRun) return; 
                const i = setInterval(() => setTick(t => t + 1), 250); 
                return () => clearInterval(i); 
            }, [!!a, !!swRun]); 
            useEffect(() => { 
                if (a && a.endAt && !a.done && Date.now() >= a.endAt && fired.current !== a.endAt) { 
                    fired.current = a.endAt; 
                    update(s => { const t2 = ensureTimers(s); if (t2.active) t2.active.done = true; }); 
                    FX.tone(523, .14, 'triangle', .08); FX.tone(659, .14, 'triangle', .08, .12); FX.tone(784, .16, 'triangle', .08, .24); FX.tone(1047, .5, 'triangle', .09, .38); 
                    FX.burst(['⏰', '✨', '💫'], 26); 
                    toast(`⏰ ${a.label} — time's up!`); 
                } 
            }); 
            if (!a && !swRun) return null; 
            const pill = { display:'flex', alignItems:'center', gap: 8, background: S.panel2, border: `1px solid ${S.lavender}`, borderRadius: 12, padding: '8px 12px', boxShadow: '0 6px 20px rgba(196,181,253,.25)', cursor:'pointer', maxWidth: 230 }; 
            const aRem = a ? (a.endAt ? (a.endAt - Date.now()) / 1000 : (a.remaining || 0) / 1000) : 0; 
            const swMs = sw ? sw.base + (sw.startedAt ? Date.now() - sw.startedAt : 0) : 0; 
            const openTool = () => { FX.play('click'); update(s => { if (s.human.studyTools) s.human.studyTools.lastTool = 'timer'; }); onNav('studytools'); }; 
            return ( 
                <div className="timer-widget"> 
                    {a && ( 
                        <div className={a.done ? 'ac-live' : ''} style={pill} onClick={openTool} title="Open timer">

                            <div style={{ minWidth: 0 }}> 
                                <div style={{ fontSize: 15, fontWeight: 800, color: a.done ? S.mint : S.lavender, lineHeight: 1.1 }}>{a.done ? 'done!' : fmtClock(aRem)}</div> 
                                <div style={{ fontSize: 10, color: S.muted, maxWidth: 120, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{a.label}</div> 
                            </div> 
                            <button style={{ marginLeft:'auto', background:'transparent', border:'none', color: S.muted, cursor:'pointer', fontSize: 12, padding: 4 }} onClick={e => { e.stopPropagation(); update(s => { ensureTimers(s).active = null; }); }}>✕</button> 
                        </div> 
                    )} 
                    {swRun && ( 
                        <div style={pill} onClick={openTool} title="Open stopwatch"> 
                            <span style={{ fontSize: 16 }}>⏱️</span> 
                            <div style={{ fontSize: 15, fontWeight: 800, color: S.pink, lineHeight: 1.1 }}>{fmtClock(swMs / 1000)}</div> 
                            <button style={{ marginLeft:'auto', background:'transparent', border:'none', color: S.muted, cursor:'pointer', fontSize: 12, padding: 4 }} onClick={e => { e.stopPropagation(); update(s => { const w = ensureTimers(s).sw; w.base += Date.now() - w.startedAt; w.startedAt = null; }); }}>⏸</button> 
                        </div> 
                    )} 
                </div> 
            ); 
        } 

        // --- ST: Clicker — a number that goes up. That's it. That's the tool. ---
        function ToolClicker({ st, update, toast }) { 
            const INK = '#08080c'; 
            const C = st.clicker || { count: 0 }; 
            const [pop, setPop] = useState(0); 
            const [floats, setFloats] = useState([]); 
            const [confirmReset, setConfirmReset] = useState(0); 
            const click = e => { 
                const n = (C.count || 0) + 1; 
                FX.tone(540 + (n % 25) * 6, .05, 'triangle', .03); 
                setPop(p => p + 1); 
                const card = e.currentTarget.getBoundingClientRect(); 
                const f = { id: n, x: e.clientX - card.left, y: e.clientY - card.top }; 
                setFloats(fl => [...fl.slice(-8), f]); 
                setTimeout(() => setFloats(fl => fl.filter(z => z.id !== f.id)), 900); 
                if (n % 100 === 0) { toast(`✨ ${fmtInt(n)} clicks!`); FX.burst(['✨', '💫', '🎯'], 20); } 
                update(s => { if (!s.human.studyTools.clicker) s.human.studyTools.clicker = { count: 0 }; s.human.studyTools.clicker.count = n; }); 
            }; 
            return ( 
                <Card onClick={click} style={{ textAlign:'center', padding: '40px 20px', position:'relative', overflow:'hidden', cursor:'pointer', color: INK, userSelect:'none', WebkitUserSelect:'none', background: 'linear-gradient(165deg,#fff4d6 0%,#ffe0ef 55%,#e2f0fc 100%)', border: `1.5px solid ${INK}2e` }}> 
                    {['✨','🎯','💫'].map((em, i) => ( 
                        <span key={i} className="ac-float" style={{ position:'absolute', left: (12 + i * 34) + '%', top: (i % 2 ? 16 : 68) + '%', fontSize: 18, opacity: .4, pointerEvents:'none', animationDelay: (i * .45) + 's' }}>{em}</span> 
                    ))} 
                    <div className="st-wiggle" style={{ fontSize: 34, marginBottom: 10 }}>🎯</div> 
                    <div style={{ fontSize: 12, color: 'rgba(8,8,12,.55)', marginBottom: 2, letterSpacing: 3, fontWeight: 800 }}>CLICKS</div> 
                    <div key={pop} className="st-num" style={{ '--g': '#f5b3d3aa', fontSize: 'clamp(72px, 18vw, 128px)', fontWeight: 900, color: INK, lineHeight: 1.15 }}>{fmtInt(C.count || 0)}</div> 
                    <div style={{ fontSize: 13, color: 'rgba(8,8,12,.6)', marginTop: 10 }}>tap anywhere on this card · one tap = +1 · no limits</div> 
                    {floats.map(f => ( 
                        <span key={f.id} style={{ position:'absolute', left: f.x, top: f.y, fontSize: 18, fontWeight: 800, color: INK, pointerEvents:'none', animation: 'rise .9s ease-out forwards' }}>+1</span> 
                    ))} 
                    <div style={{ marginTop: 18 }}> 
                        {confirmReset ? ( 
                            <button className="ac-btn" style={{ background: '#fff', color: INK, border: `1.5px solid ${INK}`, boxShadow: 'none' }} onClick={e => { e.stopPropagation(); setConfirmReset(0); update(s => { s.human.studyTools.clicker = { count: 0 }; }); toast('↺ Clicker reset'); }}>really reset?</button> 
                        ) : ( 
                            <button className="ac-btn" style={{ background: 'transparent', color: 'rgba(8,8,12,.5)', border: 'none', boxShadow: 'none', fontSize: 11, padding: '4px 8px' }} onClick={e => { e.stopPropagation(); setConfirmReset(1); setTimeout(() => setConfirmReset(0), 3000); }}>↺ reset</button> 
                        )} 
                    </div> 
                </Card> 
            ); 
        } 

        function StudyingToolsTab({ state, update, toast, onNav }) { 
            const st = state.human.studyTools || defaultStudyTools(); 
            const [tool, setTool] = useState(['rough', 'homeworks', 't321', 'timer', 'clicker'].indexOf(st.lastTool) >= 0 ? st.lastTool : 'defs');

        // ============================================================ // MAIN APP // ============================================================ 
        const TABS = [ 
            { id:'dashboard', label:'Dashboard', icon:'🏠' }, 
            { id:'ranked', label:'Ranked', icon:'⚔️' }, 
            { id:'assignments', label:'Assignments', icon:'📐' }, 
            { id:'studying', label:'Studying', icon:'📚' }, 
            { id:'studytools', label:'Studying Tools', icon:'🧰' }, 
            { id:'othertasks', label:'Other Tasks', icon:'🧹' }, 
            { id:'mocks', label:'Mock Tests', icon:'📝' }, 
            { id:'ranks', label:'Titles & Tiers', icon:'🏅' }, 
            { id:'quests', label:'Quests', icon:'🎯' }, 
            { id:'leaderboards', label:'Leaderboards', icon:'📊' }, 
            { id:'pets', label:'Pets', icon:'🐾' }, 
            { id:'inventory', label:'Inventory', icon:'🎒' }, 
            { id:'profile', label:'Profile', icon:'👤' }, 
            { id:'history', label:'History', icon:'📜' }, 
        ]; 

        function App() { 
            const [loaded, setLoaded] = useState(false); 
            const [tab, setTab] = useState('dashboard'); 
            const [toast, setToast] = useState(null); 
            const [, forceUpdate] = useState(0); 
            const [saveModal, setSaveModal] = useState(false); 
            const [welcomeBack, setWelcomeBack] = useState(null); 
            const [savedStatus, setSavedStatus] = useState(null); 
            const [profileModalId, setProfileModalId] = useState(null);
            
            const catalogRef = useRef(null); 
            const stateRef = useRef(null); 
            const [lbTick, setLbTick] = useState(0); 
            
            const bump = useCallback(() => { forceUpdate(v => v+1); setLbTick(v => v+1); }, []); 
            const toastMsg = useCallback((msg) => { setToast(null); setTimeout(() => setToast(msg), 30); FX.play(/not quite|cannot|need >|failed/i.test(msg) ? 'bad' : 'ok'); const m = /^\+(\d+) XP/.exec(msg); if (m) FX.float('+' + m[1] + ' XP'); }, []); 

            useEffect(() => { 
                injectStyles(); 
                const catalog = buildCatalog(); 
                catalogRef.current = catalog; 
                let state = loadState(catalog); 
                const isNew = !state; 
                if (!state) state = initState(catalog); 
                
                const prevTick = state.lastTick || Date.now(); 
                const elapsedAway = Date.now() - prevTick; 
                state = runTick(state, catalog, isNew); 
                stateRef.current = state; 
                saveState(state); 
                
                if (!isNew && elapsedAway > 5 * 60 * 1000) { 
                    setWelcomeBack(elapsedAway); 
                } 
                setLoaded(true); 

                const saveIv = setInterval(() => { if (stateRef.current) { const ok = saveState(stateRef.current); setSavedStatus(ok ? Date.now() : 'failed'); } }, 20000); 
                const tickIv = setInterval(() => { if (!stateRef.current) return; runTick(stateRef.current, catalogRef.current, false); bump(); }, 15000); 
                const renderIv = setInterval(() => { 
                    if (stateRef.current?.human?.activeMatch && Date.now() >= stateRef.current.human.activeMatch.end) {
                        const res = resolveRankedMatch(stateRef.current, catalogRef.current);
                        if (res) {
                            toastMsg(res.outcome === 'win' ? `🏆 Ranked Victory! +${res.rpDelta} RP` : res.outcome === 'loss' ? `💀 Ranked Defeat (${res.rpDelta} RP)` : `🤝 Ranked Draw (0 RP)`);
                            if (res.outcome === 'win') FX.burst(['⚔️','🏆','✨']);
                        }
                    }
                    bump(); 
                }, 1000); 
                const clk = e => { if (e.target.closest && e.target.closest('button')) FX.play('click'); }; 
                document.addEventListener('click', clk); 

                return () => { clearInterval(saveIv); clearInterval(tickIv); clearInterval(renderIv); document.removeEventListener('click', clk); }; 
            }, []); 

            // ============================================================
            // AUTO-SAVE TO CONNECTED academia.json (every 5 min + on tab hide)
            // ============================================================
            useEffect(() => {
                let handle = null;
                (async () => {
                    const res = await getSaveFileHandle();
                    if (res && !res.needsPermission) handle = res;
                })();

                const tick = async () => {
                    if (!handle) {
                        const res = await getSaveFileHandle();
                        if (res && !res.needsPermission) handle = res;
                    }
                    if (!handle) return;
                    try {
                        const p = await handle.queryPermission({ mode: 'readwrite' });
                        if (p === 'granted') await writeToHandle(handle, stateRef.current);
                    } catch {}
                };

                const id = setInterval(tick, 5 * 60 * 1000);
                const onHide = () => { if (document.visibilityState === 'hidden') tick(); };
                document.addEventListener('visibilitychange', onHide);
                return () => { clearInterval(id); document.removeEventListener('visibilitychange', onHide); };
            }, []);

            const update = useCallback((fn) => { if (!stateRef.current) return; fn(stateRef.current); const ok = saveState(stateRef.current); setSavedStatus(ok ? Date.now() : 'failed'); bump(); }, [bump]); 
            
            const handleComplete = useCallback((type, id, baseXp, extra) => { 
                let xp = 0; const before = stateRef.current.human.highestTitle; 
                update(s => { xp = doCompleteTask(s, catalogRef.current, type, id, baseXp, extra); }); 
                const after = stateRef.current.human.highestTitle; 
                if (after > before) setTimeout(() => { toastMsg('🎉 Title unlocked: ' + TITLES[after] + ' (+1 egg)'); FX.play('level'); FX.burst(['🎉','✨','⭐','🥚']); }, 1200); 
                return xp; 
            }, [update, toastMsg]); 

            const handleStartMatch = useCallback((mode, category) => {
                let ok = false;
                update(s => { ok = startRankedBattle(s, catalogRef.current, mode, category); });
                return ok;
            }, [update]); 

            const handleHatch = useCallback(() => { let pet = null; update(s => { pet = hatchEgg(s); }); return pet; }, [update]); 
            const handleEquip = useCallback((id) => { update(s => { s.human.equippedPet = s.human.equippedPet === id ? null : id; }); }, [update]); 
            
            const handleUsePotion = useCallback((type) => { 
                update(s => { 
                    const idx = s.human.inventory.potions.findIndex(p => p.type === type); 
                    if (idx < 0) return; const inv = s.human.inventory.potions[idx]; 
                    if (inv.quantity <= 0) return; const def = POTIONS[type]; 
                    inv.quantity -= 1; if (inv.quantity <= 0) s.human.inventory.potions.splice(idx, 1); 
                    s.human.activePotion = { type, expires: Date.now() + def.dur }; 
                }); 
            }, [update]); 

            const handleBuyPotion = useCallback((type) => {
                update(s => {
                    const def = POTIONS[type];
                    if (s.human.rp < def.cost) return;
                    s.human.rp = Math.max(0, s.human.rp - def.cost);
                    const ex = s.human.inventory.potions.find(p => p.type === type);
                    if (ex) ex.quantity++;
                    else s.human.inventory.potions.push({ type, quantity: 1 });
                });
            }, [update]);

            const handleClaim = useCallback((period, quest) => { 
                update(s => { 
                    const h = s.human; const claimed = period === 'daily' ? h.quests.daily.claimed : h.quests.weekly.claimed; 
                    if (claimed[quest.id]) return; claimed[quest.id] = true; 
                    h.xp += quest.reward.xp; 
                    if (quest.reward.egg) h.inventory.eggs += quest.reward.egg; 
                    if (quest.reward.potion) {
                        const ex = h.inventory.potions.find(p => p.type === quest.reward.potion);
                        if (ex) ex.quantity++; else h.inventory.potions.push({ type: quest.reward.potion, quantity: 1 });
                    }
                    h.careerHistory.push({ ts: Date.now(), type: 'quest', note: `Quest ${quest.name}` }); 
                }); 
            }, [update]); 

            const handleSaveProfile = useCallback((newProf) => {
                update(s => {
                    if (!s.profiles) s.profiles = {};
                    s.profiles['human'] = { ...(s.profiles['human'] || {}), ...newProf };
                    s.human.name = newProf.name;
                    s.human.customization.avatar = newProf.avatar;
                    s.human.customization.motto = newProf.motto;
                    s.human.customization.bio = newProf.bio;
                });
                toastMsg('Profile updated!');
            }, [update, toastMsg]);

            const handleExport = useCallback((filename = 'academia.json') => {
                try {
                    const toSave = { ...stateRef.current, lastSave: Date.now() };
                    const data = JSON.stringify(toSave, null, 2);
                    const blob = new Blob([data], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;   // <-- always academia.json
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    toastMsg('💾 Save exported to file!');
                } catch (e) { toastMsg('Export failed: ' + e.message); }
            }, [toastMsg]);

            const handleImport = useCallback((file) => { 
                const reader = new FileReader(); 
                reader.onload = (e) => { 
                    try { 
                        const data = JSON.parse(e.target.result); 
                        if (!data || data.version !== STATE_VERSION) throw new Error('Incompatible save version'); 
                        if (!data.human || !data.ai) throw new Error('Invalid save data'); 
                        const defaults = initHumanState(); 
                        data.human = { ...defaults, ...data.human }; 
                        if (!data.human.studyTools) data.human.studyTools = defaultStudyTools();
                        else data.human.studyTools = { ...defaultStudyTools(), ...data.human.studyTools };
                        if (!data.profiles) data.profiles = {};
                        if (!data.recentMatches) data.recentMatches = [];
                        stateRef.current = data; 
                        saveState(data); 
                        setSaveModal(false); 
                        bump(); 
                        toastMsg('✅ Save loaded! Welcome back.'); 
                        const elapsed = Date.now() - (data.lastTick || Date.now()); 
                        if (elapsed > 5 * 60 * 1000) setWelcomeBack(elapsed); 
                    } catch (err) { toastMsg('Import failed: ' + err.message); } 
                }; 
                reader.readAsText(file); 
            }, [bump, toastMsg]); 

            const catalog = catalogRef.current;
            const state = stateRef.current;
            const lbXP = useMemo(() => state ? buildXPLeaderboard(state, catalog) : [], [state?.human.xp, state?.ai, lbTick, catalog, state?.profiles]);
            const lbRP = useMemo(() => state ? buildRPLeaderboard(state, catalog) : [], [state?.human.rp, state?.ai, lbTick, catalog, state?.profiles]);
            // Per-category ranked leaderboards (independent ladders → independent #1s).
            const lbRPByCat = useMemo(() => {
                if (!state) return {};
                const out = {};
                for (const c of RANKED_CATEGORIES) out[c.id] = buildRPLeaderboard(state, catalog, c.id);
                return out;
            }, [state?.human.rpByCat, state?.ai, lbTick, catalog, state?.profiles]);

            // Allow the Ranked tab to switch which ladder the human queues into.
            const handleSetRankedCategory = useCallback((cat) => {
                update(s => { if (RANKED_CAT_BY_ID[cat] && !s.human.activeMatch) s.human.rankedCategory = cat; });
            }, [update]);
            
            if (!loaded || !catalog || !state) { 
                return <div style={{ padding: 40, textAlign:'center', color: S.muted }}>Loading Academia: Season RISE...</div>; 
            } 

            return ( 
                <div style={{ minHeight:'100vh' }}> 
                    <div className="ac-orbs"><i/><i/><i/></div>
                    <div style={{ background: S.bg2, borderBottom: `1px solid ${S.border}`, padding: '12px 20px', position:'sticky', top: 0, zIndex: 100 }}> 
                        <div style={{ maxWidth: 1200, margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap: 12 }}> 
                            <div style={{ display:'flex', alignItems:'center', gap: 10 }}> 
                                <div style={{ fontSize: 22, fontWeight: 800, letterSpacing:'-0.5px', background: `linear-gradient(135deg, ${S.lavender}, ${S.pink}, ${S.gold})`, backgroundSize:'200% auto', animation:'shimmer 6s linear infinite', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>ACADEMIA</div> 
                                <span style={{ fontSize: 10, fontWeight: 800, color: S.pink, border: `1px solid ${S.pink}66`, padding: '2px 6px', borderRadius: 4 }}>SEASON RISE</span>
                            </div> 
                            <div style={{ display:'flex', gap: 12, alignItems:'center', fontSize: 12, flexWrap:'wrap' }}>
                                <div><span style={{ color: S.muted }}>XP:</span> <strong style={{ color: S.lavender }}>{fmtInt(state.human.xp)}</strong></div>
                                <div title={`${(RANKED_CAT_BY_ID[state.human.rankedCategory]||{}).name || ''} ladder rating`}><span style={{ color: S.muted }}>{(RANKED_CAT_BY_ID[state.human.rankedCategory]||{}).icon || '⚔️'} RP:</span> <strong style={{ color: (RANKED_CAT_BY_ID[state.human.rankedCategory]||{}).color || S.gold }}>{fmtRp(getCatRp(state, 'human', state.human.rankedCategory || 'assignments'))}</strong></div>
                                <div title="Spendable coins from ranked play (used in the shop)"><span style={{ color: S.muted }}>🪙 Coins:</span> <strong style={{ color: S.gold }}>{fmtInt(state.human.rp || 0)}</strong></div>
                                <div><span style={{ color: S.muted }}>Combo:</span> <strong style={{ color: S.pink }}>{state.human.combo}×</strong></div>
                                <button className="ac-btn ac-btn-primary" style={{ padding:'8px 14px', fontSize: 12 }} onClick={() => setSaveModal(true)}> 💾 Save </button>
                                <button className="ac-btn" style={{ padding:'8px 12px', fontSize: 12 }} onClick={() => { FX.muted = !FX.muted; try { localStorage.setItem('academia_mute', FX.muted ? '1' : '0'); } catch (e) {} bump(); }}>{FX.muted ? '🔇' : '🔊'}</button>
                            </div>
                        </div> 
                    </div> 
                    <div style={{ background: S.bg, borderBottom: `1px solid ${S.border}`, position:'sticky', top: 56, zIndex: 99 }}> 
                        <div style={{ maxWidth: 1200, margin:'0 auto', padding:'8px 12px', display:'flex', gap: 4, overflowX:'auto' }}> 
                            {TABS.map(t => ( 
                                <button key={t.id} className={`ac-tab ${tab===t.id?'active':''}`} onClick={() => setTab(t.id)}> 
                                    <span style={{ marginRight: 4 }}>{t.icon}</span>{t.label} 
                                </button> 
                            ))} 
                        </div> 
                    </div> 
                    <div style={{ maxWidth: 1200, margin:'0 auto', padding:'20px 16px 60px', position:'relative', zIndex:1 }}> 
                        {tab === 'dashboard' && <Dashboard state={state} catalog={catalog} lbXP={lbXP} lbRP={lbRP} lbRPByCat={lbRPByCat} onNav={setTab} onOpenProfile={setProfileModalId} />}
                        {tab === 'ranked' && <RankedTab state={state} catalog={catalog} lbRP={lbRP} lbRPByCat={lbRPByCat} onStartMatch={handleStartMatch} onSetCategory={handleSetRankedCategory} toast={toastMsg} onOpenProfile={setProfileModalId} />}
                        {tab === 'assignments' && <AssignmentsTab state={state} onComplete={handleComplete} toast={toastMsg} />} 
                        {tab === 'studying' && <StudyingTab state={state} onComplete={handleComplete} toast={toastMsg} />} 
                        {tab === 'studytools' && <StudyingToolsTab state={state} update={update} toast={toastMsg} onNav={setTab} />}
                        {tab === 'othertasks' && <OtherTasksTab state={state} onComplete={handleComplete} toast={toastMsg} />} 
                        {tab === 'mocks' && <MockTestsTab state={state} onComplete={handleComplete} toast={toastMsg} />} 
                        {tab === 'ranks' && <TitlesTab state={state} lbRP={lbRP} lbRPByCat={lbRPByCat} />}
                        {tab === 'quests' && <QuestsTab state={state} onClaim={handleClaim} toast={toastMsg} />} 
                        {tab === 'leaderboards' && <LeaderboardTab state={state} catalog={catalog} lbXP={lbXP} lbRP={lbRP} lbRPByCat={lbRPByCat} onOpenProfile={setProfileModalId} />}
                        {tab === 'pets' && <PetsTab state={state} onHatch={handleHatch} onEquip={handleEquip} toast={toastMsg} />} 
                        {tab === 'inventory' && <InventoryTab state={state} onUsePotion={handleUsePotion} onBuyPotion={handleBuyPotion} toast={toastMsg} />} 
                        {tab === 'profile' && <ProfileModal playerId="human" state={state} catalog={catalog} lbXP={lbXP} lbRP={lbRP} lbRPByCat={lbRPByCat} onClose={() => {}} onSaveProfile={handleSaveProfile} />}
                        {tab === 'history' && <HistoryTab state={state} />} 
                    </div> 
                    {saveModal && <SaveModal state={state} onExport={handleExport} onImport={handleImport} onClose={() => setSaveModal(false)} toast={toastMsg} />}
                    {welcomeBack !== null && <WelcomeBack elapsedMs={welcomeBack} onClose={() => setWelcomeBack(null)} />} 
                    {profileModalId !== null && <ProfileModal playerId={profileModalId} state={state} catalog={catalog} lbXP={lbXP} lbRP={lbRP} lbRPByCat={lbRPByCat} onClose={() => setProfileModalId(null)} onSaveProfile={handleSaveProfile} />}
                    <Toast msg={toast} onDone={() => setToast(null)} /> 
                    <TimerWidget state={state} update={update} toast={m => setToast(m)} onNav={setTab} /> 
                </div> 
            ); 
        } 

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />); 
    </script>
</body>
</html>
